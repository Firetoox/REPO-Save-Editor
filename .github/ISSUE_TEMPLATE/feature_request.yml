name: Feature request / Wunsch
description: Suggest an idea for the editor. / Schlage eine Idee für den Editor vor.
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to do? / Was möchtest du tun?
      description: Describe the goal, not only the solution. / Beschreibe das Ziel, nicht nur die Lösung.
    validations:
      required: true
  - type: textarea
    id: game
    attributes:
      label: Game data / Spieldaten
      description: Which values in the save or which game feature is it about, if you know? / Um welche Werte im Spielstand oder welche Spielfunktion geht es, falls bekannt?
