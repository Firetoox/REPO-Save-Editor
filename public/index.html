          <span class="small muted">${t('side.deletedLine', { date: d.newest ? fmtTime(d.newest.mtime) : '–' })}</span></button>`)}` : ''}
      <button class="btn sm ghost" data-act="reload-saves">${svg(I.reload, 14)}${t('side.refresh')}</button>
    </div>
    <div class="card vstack gap-12">
      <h2 class="caps small muted hstack">${svg(I.shieldOk)}${t('side.backups')}</h2>
      <label class="option">
        <input type="checkbox" data-fk="autobackup" data-check="autobackup"${attr('checked', S.autoBackup)}><span>${t('side.autoBackup')}</span></label>
      <div class="small muted">${tx('side.originalNote', { file: html`<span class="mono">…_original.es3</span>` })}</div>
      <div><div class="small muted">${t('side.backupDir')}</div><div class="mono small wrap c-soft">${breakable(displayPath(S.server.backupDir))}</div></div>
      ${sel ? html`<div class="small muted">${tp('n.editorBackup', sel.editorBackups)} · ${tp('n.gameBackup', sel.gameBackups)}</div>` : ''}
      <button class="btn sm" data-act="open-folder" data-what="backups">${svg(I.folder, 14)}${t('btn.openBackups')}</button>
    </div>
  </aside>`;
}

function viewNoSave() {
  if (!S.server.savesDirExists) {
    const text = tx('nosave.dirMissing', {
      path: html`<br><span class="mono">${breakable(displayPath(S.server.savesDir))}</span><br>`,
      config: html`<span class="mono">${displayPath(S.server.configFile) || 'config.json'}</span>`,
      key: html`<span class="mono">"savesDir"</span>`
    });
    return html`<div class="body"><div class="content">${notice('warn', text)}</div></div>`;
  }
  const text = S.error || (S.saves.length ? t('nosave.loading') : t('nosave.none'));
  // the open save was deleted by the game: its backups are one click away
  const gone = S.saveId && S.deleted.some(d => d.id === S.saveId);
  return html`<div class="body"><div class="content"><div class="empty vstack">${text}
    ${gone ? html`<div><button class="btn" data-act="view-backups" data-id="${S.saveId}">${svg(I.shieldOk)}${t('side.allBackups')}</button></div>` : ''}</div></div></div>`;
}

function viewSave(chg) {
  const m = S.edit, info = S.loaded.info;
  const counts = { run: 0, players: 0, items: 0 };
  chg.forEach(c => { counts[c.group]++; });
  const tabs = ['run', 'players', 'items', 'profiles', 'backups', 'raw'];
  const n = chg.length;
  const view = { players: viewPlayers, items: viewItems, profiles: viewProfiles, backups: viewBackups, raw: viewRaw }[S.tab] || viewRun;
  return html`<section class="savehead">
    <div class="headrow"><div class="shrink">
      <div class="mono small dim wrap">${t('save.fileLine', { file: S.saveId + '.es3' })}${info.saveVersion != null ? ' · saveVersion ' + info.saveVersion : ''}</div>
      <h1>${m.team || S.saveId}</h1>
      <div class="meta">
        ${m.run.level !== undefined ? html`<span>Level <strong>${fmt(m.run.level)}</strong></span>` : ''}
        ${m.run.currency !== undefined ? html`<span>${t('save.money')} <strong>${money(m.run.currency)}</strong></span>` : ''}
        ${m.run.lives !== undefined ? html`<span>${t('save.lives')} <strong>${fmt(m.run.lives)}</strong></span>` : ''}
        <span>${tp('n.player', m.players.length)}</span><span>${t('save.playtime', { time: playTime(info.timePlayed) })}</span>
        <span>${t('save.lastPlayed', { date: fmtDate(info.date) })}</span>
      </div></div>
      <div class="actions">
        <button class="btn" data-act="open-duplicate"${attr('disabled', S.busy)}>${svg(I.copy)}${t('btn.duplicate')}</button>
        <button class="btn" data-act="backup-now"${attr('disabled', S.busy)}>${svg(I.shield)}${t('btn.backup')}</button>
        <button class="btn ghost" data-act="reload-save"${attr('disabled', S.busy)}>${svg(I.reload)}${t('btn.reload')}</button>
        <button class="btn ghost" data-act="discard"${attr('disabled', !n || S.busy)}>${t('btn.discard')}</button>
        <button class="btn primary" data-act="open-write"${attr('disabled', !n || S.busy)}>${t('btn.write')}${n ? html` <span class="badge">${n}</span>` : ''}</button>
      </div></div>
    <nav class="tabs" aria-label="${t('tab.nav')}">${tabs.map(id => html`<button class="tab" aria-current="${S.tab === id ? 'page' : 'false'}" data-act="tab" data-tab="${id}">${t('tab.' + id)}${badge(counts[id])}</button>`)}</nav>
  </section>
  <div class="body"><div class="content">${view(chg)}</div>${viewAside(chg)}</div>`;
}

function viewRun() {
  const a = S.loaded.model, m = S.edit;
  const cards = C().run.filter(f => m.run[f.key] !== undefined).map(f => {
    const v = m.run[f.key], o = a.run[f.key], changed = v !== o;
    const label = L(f.label);
    const input = html`<input class="bignum" type="number" data-fk="run:${f.key}" data-num="run:${f.key}" aria-label="${label}" value="${v}" min="${f.min}" max="${f.max}">`;
    return html`<div class="card${changed ? ' changed' : ''}">
      <div class="field-head"><div class="shrink"><h3 class="strong">${label}</h3><div class="key">runStats.${f.key}</div></div>
        ${changed ? html`<button class="iconbtn accent" data-act="run-reset" data-k="${f.key}" aria-label="${t('run.reset', { label, value: fmt(o) })}">${svg(I.undo)}</button>` : ''}</div>
      <div class="stepper">${stepper({ act: 'run-add', data: { k: f.key }, step: f.step, label, size: '', icon: 18 }, input)}</div>
      <div class="foot"><span>${L(f.hint)}</span>
        <span class="${changedClass(changed, 'dim')}">${changed ? t('common.before', { value: fmt(o) }) : t('common.unchanged')}</span></div>
      ${f.chips ? html`<div class="chips">${f.chips.map(c => html`<button class="chip" data-act="run-add" data-k="${f.key}" data-add="${c}" aria-label="${label} +${fmt(c)}">+${fmt(c)}</button>`)}</div>` : ''}
    </div>`;
  });
  return html`<div class="card${a.team !== m.team ? ' changed' : ''} hstack teamrow">
      <div class="vstack shrink gap-6"><label for="team" class="strong">${t('run.team')}</label>
      <input id="team" class="textin" type="text" maxlength="${LIM().teamName}" data-fk="team" data-text="team" value="${m.team}"></div>
      <div class="key">teamName</div></div>
    <div class="grid">${cards}</div>${viewPrices()}`;
}

function viewPrices() {
  const a = S.loaded.model, m = S.edit;
  const keys = Object.keys(m.upgradesPurchased || {});
  if (!keys.length) return '';
  const total = keys.reduce((s, k) => s + (m.upgradesPurchased[k] || 0), 0);
  const rows = keys.map(k => {
    const v = m.upgradesPurchased[k] || 0, o = a.upgradesPurchased[k] || 0, changed = v !== o;
    const name = itemInfo(k).label.replace(/ Upgrade$/, '');
    const middle = html`<span class="pricenum figure ${changedClass(changed)}">${v}</span>`;
    return html`<div class="pricerow"><span class="shrink"><span class="name">${name}</span>${changed ? html` <span class="small c-accent">${t('common.before', { value: o })}</span>` : ''}</span>
      <span class="mini">${stepper({ act: 'price-add', data: { key: k }, step: 1, label: t('prices.label', { name }), size: 'xs', icon: 12 }, middle)}</span></div>`;
  });
  return html`<div class="card vstack gap-12">
    <div class="field-head"><div><h3 class="strong">${t('prices.title')}</h3><div class="key">itemsUpgradesPurchased</div></div>
    <button class="btn sm" data-act="price-reset"${attr('disabled', !total)}>${t('prices.reset')}</button></div>
    <div class="small muted">${t('prices.note')}</div>
    <div class="grid prices">${rows}</div></div>`;
}

function viewPlayers(chg) {
  const a = S.loaded.model, m = S.edit;
  const mp = notice('info', t('players.multi'));
  if (!m.players.length) return html`${mp}<div class="empty">${t('players.none')}</div>`;
  const p = selPlayer(), o = a.players.find(x => x.id === p.id) || p;
  const cards = m.players.map((pl, i) => {
    const sum = m.upgradeFields.reduce((s, f) => s + (pl.up[f] || 0), 0);
    const on = pl.id === p.id;
    return html`<button class="pbtn" aria-pressed="${on ? 'true' : 'false'}" data-act="player" data-id="${pl.id}">
      <span class="avatar" style="background: ${playerColor(i)}" aria-hidden="true">${(pl.name || '?').charAt(0).toUpperCase()}</span>
      <span class="vstack shrink gap-0"><span class="strong hstack gap-6">${pl.name}
        ${pl.crown ? html`<span class="c-crown">${svg(I.crown)}<span class="sr">${t('players.hasCrown')}</span></span>` : ''}
        ${chg.some(c => c.pid === pl.id) ? html`<span class="cdot"></span><span class="sr">${t('players.changed')}</span>` : ''}</span>
      <span class="small muted">${pl.hp != null ? pl.hp + ' HP · ' : ''}${tp('n.level', sum)}</span></span></button>`;
  });
  const hpInput = html`<input class="midnum wide ${changedClass(p.hp !== o.hp)}" type="number" data-fk="hp" data-num="hp" aria-label="${t('players.hp')}" value="${p.hp}">`;
  const hpBox = p.hp == null ? html`<div class="small muted">${t('players.noHp')}</div>` :
    html`<div class="vstack gap-6"><div class="small muted">${t('players.hp')} · <span class="mono">playerHealth</span></div>
      <div class="mini">${stepper({ act: 'hp-add', data: {}, step: 10, label: 'HP' }, hpInput)}
      <button class="btn sm heal" data-act="hp-full" title="${t('players.healTitle')}">${t('players.heal', { hp: Math.min(maxHp(p), LIM().hp) })}</button></div></div>`;
  const rows = m.upgradeFields.map(f => {
    const u = upgradeInfo(f), v = p.up[f] || 0, ov = o.up[f] || 0, changed = v !== ov;
    // bars: light = kept, accent = added, dark red = removed
    const pips = Array.from({ length: PIPS }, (_, i) => {
      const state = i < Math.min(v, ov) ? ' kept' : i < v ? ' added' : i < ov ? ' removed' : '';
      return html`<span class="pip${state}"></span>`;
    });
    const note = changed ? t('common.before', { value: ov }) : (v > PIPS ? t('players.over', { n: v - PIPS, max: PIPS }) : t('players.level', { n: v }));
    const input = html`<input class="midnum ${changedClass(changed)}" type="number" data-fk="up:${f}" data-num="up:${f}" aria-label="${u.name}" value="${v}">`;
    // the in-game (English) name, explained in the other UI languages
    const hint = u.hint && u.hint[S.lang] ? html` <span class="muted plain">· ${u.hint[S.lang]}</span>` : '';
    return html`<div class="card upcard${changed ? ' changed' : ''}">
      <div class="between"><div class="shrink"><h3 class="strong">${u.name}${hint}</h3><div class="key">${f}</div></div>
      <div class="mini">${stepper({ act: 'up-add', data: { f }, step: 1, label: u.name }, input)}</div></div>
      <div class="pips" aria-hidden="true">${pips}<span class="small note ${changedClass(changed, 'dim')}">${note}</span></div></div>`;
  });
  return html`${mp}<div class="players" role="group" aria-label="${t('players.select')}">${cards}</div>
    <div class="card toolbar"><div class="hstack hpbar">${hpBox}
      <label class="option crownopt">
        <input type="checkbox" data-fk="crown" data-check="crown"${attr('checked', p.crown)}><span>${t('players.crown')} <span class="key">playerHasCrown</span></span></label></div>
      <div class="actions">
        <button class="btn sm" data-act="all-plus">${t('players.allPlus')}</button>
        <button class="btn sm" data-act="all-ten">${t('players.allTen')}</button>
        <button class="btn sm" data-act="copy-all">${t('players.copyAll')}</button>
      </div></div>
    <div class="small muted inset">${t('players.steamId', { id: p.id })}</div>
    <div class="grid up">${rows}</div>`;
}

function visibleItems() {
  const m = S.edit, a = S.loaded.model;
  const list = C().items.filter(it => !it.disabled || m.inv[it.key] || a.inv[it.key]);
  for (const k of new Set(Object.keys(m.inv).concat(Object.keys(a.inv)))) if (!list.some(it => it.key === k)) list.push(itemInfo(k));
  return list;
}

function viewItems() {
  const a = S.loaded.model, m = S.edit;
  const all = visibleItems();
  const q = S.items.q.trim().toLowerCase();
  const shown = all.filter(it => (S.items.cat === 'all' || it.cat === S.items.cat) && (!q || it.label.toLowerCase().includes(q) || it.key.toLowerCase().includes(q)));
  const owned = all.filter(it => (m.inv[it.key] || 0) > 0);
  const total = owned.reduce((s, it) => s + m.inv[it.key], 0);
  const truck = owned.map(it => {
    const changed = count(m.inv, it.key) !== count(a.inv, it.key);
    return html`<span class="truckchip${changed ? ' changed' : ''}"><span class="sq" style="background: ${catOf(it.cat).color}"></span>
      ${it.label} <strong class="figure">×${m.inv[it.key]}</strong></span>`;
  });
  const cats = [{ id: 'all', label: t('filter.all') }].concat(C().categories).map(c => {
    const n = c.id === 'all' ? all.length : all.filter(it => it.cat === c.id).length;
    return n ? filterButton({ act: 'item-cat', data: { cat: c.id }, active: S.items.cat === c.id, label: L(c.label), color: c.color, count: n }) : '';
  });
  const cards = shown.map(it => {
    const cat = catOf(it.cat), v = m.inv[it.key] || 0, o = a.inv[it.key] || 0, changed = v !== o;
    const over = v > (it.max || 1);
    const note = changed ? t('items.before', { n: o }) : (over ? t('items.overLimit', { max: it.max }) : t('items.inTruck'));
    const middle = html`<span class="countmid"><span class="figure count">×${v}</span>
      <span class="note ${changedClass(changed || over, 'dim')}">${note}</span></span>`;
    const control = v === 0
      ? html`<button class="addbtn" data-act="inv-add" data-key="${it.key}" data-add="1" aria-label="${t('items.add', { label: it.label })}">${svg(I.plus, 14, 2.4)}${t('items.addButton')}</button>`
      : html`<div class="countbar">${stepper({ act: 'inv-add', data: { key: it.key }, step: 1, label: it.label }, middle)}</div>`;
    const tag = it.disabled ? html` <span class="tag bad">${t('items.disabled')}</span>`
      : it.wip ? html` <span class="tag warn" title="${t('items.wipHint')}">${t('items.wip')}</span>` : '';
    return html`<div class="itemcard${v ? ' owned' : ''}${changed ? ' changed' : ''}">
      <div class="itemtop"><div class="itemicon" style="background: ${tint(cat.color, 16)}; color: ${cat.color}">${svg(I.cat[it.cat] || I.cat.other, 22)}</div>
      <div class="shrink"><div class="strong">${it.label}${tag}</div><div class="itemkey" title="${it.key}">${it.key}</div></div></div>
      ${control}</div>`;
  });
  const batt = a.batteryLow > 0
    ? html`<div class="card between battery${m.fillBatteries ? ' changed' : ''}">
      <div class="hstack gap-12"><span class="c-ok">${svg(I.battery, 22)}</span>
        <div><h3 class="strong">${t('items.batteries')}</h3><div class="small muted">${t('items.batteriesLow', { items: tp('n.item', a.batteryLow) })} · <span class="mono">itemStatBattery</span></div></div></div>
      <button class="btn sm${m.fillBatteries ? ' primary' : ''}" data-act="fill-batt" aria-pressed="${m.fillBatteries ? 'true' : 'false'}">${t('items.charge')}</button></div>`
    : '';
  const truckCount = t('items.truckCount', { items: tp('n.item', total), kinds: tp('n.kind', owned.length) });
  return html`<div class="card vstack gap-12">
      <div class="between truckhead"><h2 class="caps">${t('items.truck')}</h2>
        <div class="small muted">${truckCount} · <span class="mono">itemsPurchased</span></div></div>
      <div class="hstack">${truck.length ? truck : html`<span class="muted">${t('items.truckEmpty')}</span>`}</div></div>
    ${wipNote()}
    ${batt}
    <div class="hstack gap-12">${searchBox('item-search', 'item-search', S.items.q, t('items.search'), t('items.searchLabel'))}
      <div class="small muted">${t('items.shown', { n: shown.length, total: all.length })}</div></div>
    ${filterRow('item-cat-label', t('filter.category'), cats)}
    ${shown.length ? html`<div class="grid items">${cards}</div>` : html`<div class="empty">${t('items.noHits')}</div>`}
    <div class="small muted">${t('items.note')}</div>`;
}

function viewProfiles() {
  const card = (p, own) => html`<div class="card vstack">
    <div class="field-head"><h3 class="strong">${p.name}</h3>
    <span class="tag ${own ? 'accent' : 'info'}">${t(own ? 'prof.own' : 'prof.builtin')}</span></div>
    <div class="small muted">${p.desc || profileSummary(p)}</div>
    <div class="small dim">${t(p.min ? 'prof.min' : 'prof.exact')}</div>
    <div class="actions"><button class="btn sm primary" data-act="profile-apply" data-pid="${p.id}">${t('prof.apply')}</button>
    ${own ? html`<button class="btn sm danger" data-act="profile-delete" data-pid="${p.id}">${t('prof.delete')}</button>` : ''}</div></div>`;
  return html`${notice('info', t('prof.note'))}
    <h2 class="caps">${t('prof.builtinTitle')}</h2>
    <div class="grid profiles">${builtinProfiles().map(p => card(p, false))}</div>
    <div class="between"><h2 class="caps">${t('prof.ownTitle')}</h2><button class="btn sm" data-act="profile-new">${svg(I.plus, 14)}${t('prof.saveCurrent')}</button></div>
    ${S.profiles.length ? html`<div class="grid profiles">${S.profiles.map(p => card(p, true))}</div>` : html`<div class="empty">${t('prof.noneOwn')}</div>`}`;
}

// Editor backups are named <time>_<reason>.es3; the server sends its reasons (REASON in lib/server.js)
// as { original: 'original', beforeSave: 'before-save', … }, and the keys name the texts.
const reasonKey = reason => Object.keys(S.server.backupReasons).find(k => S.server.backupReasons[k] === reason);
const backupLabel = b => (b.source === 'game' ? t('backup.game', { name: (b.file.match(/BACKUP\d+/) || [''])[0] })
  : reasonKey(b.reason) ? t('backup.' + reasonKey(b.reason)) : t('backup.editor'));
/** Shorter label for the cosmetics side panel, where every backup is the editor's or MetaSave.bak. */
const backupShortLabel = b => (b.source === 'game' ? t('cos.metaBak')
  : reasonKey(b.reason) ? t('backupShort.' + reasonKey(b.reason)) : t('backup.editor'));
/** File name of the backup the next save will create, as shown in the dialogs. */
const nextBackupName = () => t('date.placeholder') + '_' + S.server.backupReasons.beforeSave + '.es3';

function viewBackups() {
  if (!S.backups) return html`<div class="empty">${t('backups.loading')}</div>`;
  const rows = S.backups.map((b, i) => {
    const disabled = attr('disabled', !b.ok);
    return html`<div class="trow" role="row"><div role="cell">${fmtTime(b.mtime)}</div><div role="cell"><span class="tag ${b.source === 'game' ? 'info' : 'accent'}">${backupLabel(b)}</span></div>
      <div role="cell" class="mono small file" title="${b.file}">${b.file}</div>
      <div role="cell" class="caps-num">${b.ok && b.level != null ? b.level : '–'}</div>
      <div role="cell">${b.ok ? (b.currency != null ? money(b.currency) : '–') : html`<span class="c-bad">${t('backups.broken')}</span>`}</div>
      <div role="cell" class="acts">
        <button class="btn sm" data-act="compare" data-i="${i}"${disabled} aria-label="${t('backups.compareLabel', { file: b.file })}">${t('backups.compare')}</button>
        <button class="btn sm" data-act="restore" data-i="${i}"${disabled} aria-label="${t('backups.restoreLabel', { file: b.file })}">${t('btn.restore')}</button>
      </div></div>`;
  });
  const intro = t('backups.intro', { when: t(S.autoBackup ? 'backups.whenOn' : 'backups.whenOff') });
  const heads = ['date', 'source', 'file', 'level', 'money'].map(h => html`<div role="columnheader">${t('backups.' + h)}</div>`);
  return html`${notice('info', intro)}
    <div class="actions">
      <button class="btn sm" data-act="backup-now" data-where="tab">${svg(I.shield, 14)}${t('btn.backup')}</button>
      <button class="btn sm" data-act="open-folder" data-what="backups" data-scope="save">${svg(I.folder, 14)}${t('btn.openBackups')}</button>
      <button class="btn sm" data-act="open-folder" data-what="saves" data-scope="save">${svg(I.folder, 14)}${t('btn.openSaves')}</button>
    </div>
    <div class="table" role="table" aria-label="${t('tab.backups')}">
    <div class="trow head" role="row">${heads}<div role="columnheader"><span class="sr">${t('backups.actions')}</span></div></div>
    ${rows.length ? rows : html`<div class="trow" role="row"><div class="muted" role="cell">${t('backups.none')}</div></div>`}</div>`;
}

function rawState() {
  if (!S.raw) return { ok: false, msg: t('common.loading') };
  try { JSON.parse(S.raw.text); } catch (e) { return { ok: false, msg: t('raw.invalid', { error: e.message }) }; }
  if (S.raw.text === S.raw.original) return { ok: true, changed: false, msg: t('raw.valid') };
  return { ok: true, changed: true, msg: t('raw.validChanged') };
}
const rawButtonDisabled = () => { const r = rawState(); return !r.ok || !r.changed || changes().length > 0 || S.busy; };

function viewRaw(chg) {
  if (!S.raw) return html`<div class="empty">${t('raw.loading')}</div>`;
  const r = rawState();
  return html`${notice('warn', t('raw.warning'))}
    ${chg.length ? notice('info', t('raw.pending', { changes: tp('n.change', chg.length) })) : ''}
    <div class="actions rawbar"><button class="btn sm" data-act="raw-reload">${svg(I.reload, 14)}${t('btn.reload')}</button>
    <button class="btn sm primary" data-act="raw-write" id="raw-write"${attr('disabled', rawButtonDisabled())}>${t('raw.write')}</button>
    <span id="raw-status" class="small ${r.ok ? (r.changed ? 'c-accent' : 'c-ok') : 'c-bad'}">${r.msg}</span></div>
    <label for="rawbox" class="sr">${t('raw.label')}</label><textarea id="rawbox" class="rawbox" spellcheck="false" data-fk="raw" data-raw="1" data-keep-scroll="raw">${S.raw.text}</textarea>`;
}

// ---------- all backups (also of saves the game deleted) ----------------------------------------------------
const ALL_ROWS = 8; // backups shown per save before "show more"
const backupState = b => [b.team, 'Level ' + (b.level != null ? b.level : '–'), b.currency != null ? money(b.currency) : '–', fmtTime(b.mtime)].join(' · ');

function viewAllBackups() {
  const A = S.all, list = A.list;
  const head = html`<section class="savehead"><div class="headrow"><div class="shrink">
      <div class="mono small dim wrap">${breakable(displayPath(S.server.backupDir))}</div>
      <h1>${t('all.title')}</h1>
      ${list ? html`<div class="meta"><span>${tp('n.saveGroup', list.length)}</span><span>${tp('n.deletedSave', list.filter(g => !g.exists).length)}</span></div>` : ''}
    </div><div class="actions">
      <button class="btn ghost" data-act="all-reload"${attr('disabled', S.busy)}>${svg(I.reload)}${t('btn.reload')}</button>
      <button class="btn" data-act="open-folder" data-what="backups">${svg(I.folder)}${t('btn.openBackups')}</button>
    </div></div></section>`;
  if (!list) return html`${head}<div class="body"><div class="content"><div class="empty">${t('all.loading')}</div></div></div>`;
  const q = A.q.trim().toLowerCase();
  const has = text => String(text || '').toLowerCase().includes(q);
  const matches = g => !q || has(g.team) || has(g.id) || g.backups.some(b => has(b.team));
  const shown = list.filter(g => (!A.focus || g.id === A.focus) && (A.show === 'all' || (A.show === 'deleted') === !g.exists) && matches(g));
  const focused = A.focus && list.find(g => g.id === A.focus);
  const shows = [['all', 'filter.all'], ['existing', 'all.showExisting'], ['deleted', 'all.showDeleted']]
    .map(([k, key]) => filterButton({ act: 'all-show', data: { show: k }, active: A.show === k, label: t(key) }));
  const tools = focused
    ? html`<div class="hstack gap-12"><span class="strong">${t('all.focus', { team: focused.team || focused.id })}</span><button class="btn sm" data-act="all-unfocus">${t('all.showEverything')}</button></div>`
    : html`<div class="hstack gap-12">${searchBox('all-search', 'all-search', A.q, t('all.search'), t('all.searchLabel'))}</div>${filterRow('all-show-label', t('filter.status'), shows)}`;
  return html`${head}<div class="body"><div class="content">
    ${notice('info', t('all.intro'))}${tools}
    ${shown.length ? shown.map(viewBackupGroup) : html`<div class="empty">${t(list.length ? 'all.noHits' : 'all.none')}</div>`}
  </div></div>`;
}

/** One save in "All backups": team name, folder, whether it still exists, its backups. */
function viewBackupGroup(g) {
  const all = S.all.more.includes(g.id);
  const rows = (all ? g.backups : g.backups.slice(0, ALL_ROWS)).map(b => html`<div class="trow" role="row"><div role="cell">${fmtTime(b.mtime)}</div>
      <div role="cell"><span class="tag ${b.source === 'game' ? 'info' : 'accent'}">${backupLabel(b)}</span></div>
      <div role="cell" class="file">${b.ok ? b.team || t('all.unnamed') : ''}</div>
      <div role="cell" class="caps-num">${b.ok && b.level != null ? b.level : '–'}</div>
      <div role="cell">${b.ok ? (b.currency != null ? money(b.currency) : '–') : html`<span class="c-bad">${t('backups.broken')}</span>`}</div>
      <div role="cell" class="acts"><button class="btn sm" data-act="${g.exists ? 'all-restore' : 'all-undelete'}" data-id="${g.id}" data-source="${b.source}" data-file="${b.file}"${attr('disabled', !b.ok)}
        aria-label="${t('backups.restoreLabel', { file: b.file })}">${t('btn.restore')}</button></div></div>`);
  const now = g.current && g.current.ok ? t('all.current', { state: backupState(g.current) }) : '';
  const hidden = g.backups.length - rows.length;
  const heads = ['date', 'source'].map(h => html`<div role="columnheader">${t('backups.' + h)}</div>`).concat(html`<div role="columnheader">${t('all.colTeam')}</div>`,
    ['level', 'money'].map(h => html`<div role="columnheader">${t('backups.' + h)}</div>`), html`<div role="columnheader"><span class="sr">${t('backups.actions')}</span></div>`);
  return html`<div class="card vstack gap-12">
    <div class="between"><div class="shrink"><h2 class="strong hstack">${g.team || t('all.unnamed')} <span class="tag ${g.exists ? 'info' : 'bad'}">${t(g.exists ? 'all.exists' : 'all.deleted')}</span></h2>
      <div class="mono small dim wrap">${g.id}${now ? ' · ' + now : ''}</div></div>
      ${g.exists ? html`<button class="btn sm" data-act="select-save" data-id="${g.id}">${t('all.open')}</button>` : ''}</div>
    ${rows.length ? html`<div class="table" role="table" aria-label="${g.team || g.id}"><div class="trow head" role="row">${heads}</div>${rows}</div>`
      : html`<div class="small muted">${t('all.none')}</div>`}
    ${hidden > 0 ? html`<div><button class="btn sm ghost" data-act="all-more" data-id="${g.id}">${tp('all.more', hidden)}</button></div>` : ''}
  </div>`;
}

/** Current cosmetic filters; the status filter (unlocked/locked) can be left out for bulk actions. */
function cosFilter(ignoreStatus) {
  const f = S.cos, q = f.q.trim().toLowerCase(), on = S.metaEdit;
  return c => (f.cat === 'all' || c.category === f.cat) && (!f.type || c.type === f.type) &&
    (f.rarity === 'all' || c.rarity === f.rarity) &&
    (!q || c.name.toLowerCase().includes(q) || c.type.toLowerCase().includes(q)) &&
    (ignoreStatus || f.show === 'all' || (f.show === 'on' && on.has(c.id)) || (f.show === 'off' && !on.has(c.id)));
}

function viewCosmetics() {
  if (S.metaError) return html`<div class="body"><div class="content">${notice('warn', t('cos.unavailable', { error: S.metaError }))}</div></div>`;
  if (!S.meta) return html`<div class="body"><div class="content"><div class="empty">${t('cos.loading')}</div></div></div>`;
  const list = COS();
  const on = S.metaEdit, before = new Set(S.meta.unlocks), equipped = new Set(S.meta.equipped);
  const mc = metaChanges();
  const f = S.cos;
  const inCat = list.filter(c => f.cat === 'all' || c.category === f.cat);
  const shown = list.filter(cosFilter(false));
  const ratio = pool => pool.filter(x => on.has(x.id)).length + '/' + pool.length;
  const cats = [['all', null]].concat(COS_CATEGORIES).map(([key, color]) => {
    const pool = key === 'all' ? list : list.filter(x => x.category === key);
    const label = key === 'all' ? t('filter.all') : cosCategoryName(key);
    return filterButton({ act: 'cos-cat', data: { cat: key }, active: f.cat === key, label, color, count: ratio(pool) });
  });
  const rarities = list.some(c => c.rarity != null) ? ['all', 0, 1, 2, 3].map(r => {
    const pool = inCat.filter(x => r === 'all' || x.rarity === r);
    const label = r === 'all' ? t('filter.all') : rarityName(r);
    return filterButton({ act: 'cos-rarity', data: { rarity: r }, active: f.rarity === r, label, color: r === 'all' ? null : RARITY_COLORS[r], count: ratio(pool) });
  }) : null;
  const shows = [['all', 'filter.all'], ['on', 'cos.showOn'], ['off', 'cos.showOff']].map(([k, key]) => filterButton({ act: 'cos-show', data: { show: k }, active: f.show === k, label: t(key) }));
  const types = [...new Set(inCat.map(c => c.type))].sort();
  const cards = shown.map(c => {
    const isOn = on.has(c.id), changed = isOn !== before.has(c.id), eq = equipped.has(c.id);
    const st = eq ? html`<span class="st c-ok">${svg(I.shirt, 12)}${t('cos.equipped')}</span>`
      : isOn ? html`<span class="st ${changedClass(changed, 'c-soft')}">${svg(I.unlock, 12)}${t(changed ? 'cos.willUnlock' : 'cos.showOn')}</span>`
        : html`<span class="st ${changedClass(changed, 'dim')}">${svg(I.lock, 12)}${t(changed ? 'cos.willLock' : 'cos.showOff')}</span>`;
    const rar = c.rarity != null ? html`<span class="rar" style="color: ${RARITY_COLORS[c.rarity]}; background: ${tint(RARITY_COLORS[c.rarity], 14)}">${rarityName(c.rarity)}</span>` : '';
    const fixed = c.colorable === false ? html`<span class="rar fixed" title="${t('cos.fixedTitle')}">${t('cos.fixed')}</span>` : '';
    // built-in list after a game update: saved unlocks cannot be taken back (see cosmeticsLockable)
    const keep = !eq && !S.server.cosmeticsLockable && before.has(c.id);
    const lockedTitle = eq ? html` disabled title="${t('cos.equippedTitle')}"` : keep ? html` disabled title="${t('cos.noLockTitle')}"` : '';
    return html`<button class="coscard${isOn ? ' on' : ''}${changed ? ' changed' : ''}" data-act="cos-toggle" data-cid="${c.id}"${lockedTitle} aria-pressed="${isOn ? 'true' : 'false'}">
      <span class="strong">${c.name}</span>
      <span class="small muted hstack gap-6"><span class="sq" style="background: ${cosColor(c.category)}"></span>${c.type}</span>
      ${rar || fixed ? html`<span class="tags">${rar}${fixed}</span>` : ''}${st}</button>`;
  });
  const offShown = shown.filter(c => !on.has(c.id)).length;
  const allOn = list.every(c => on.has(c.id));
  return html`<section class="savehead">
    <div class="headrow"><div class="shrink">
      <div class="mono small dim wrap">${t('cos.fileLine', { file: displayPath(S.meta.file) })}</div>
      <h1>Cosmetics</h1>
      <div class="meta">
        <span>${tx('cos.unlockedOf', { n: html`<strong>${fmt(knownUnlocked())}</strong>`, total: fmt(list.length) })}</span>
        <span>${t('cos.equippedCount', { n: S.meta.equipped.length })}</span>
        <span>${tp('n.token', S.meta.tokens)}</span>
        <span>${t('cos.namesFrom', { source: t('source.' + S.server.cosmetics.source) })}</span>
      </div>
    </div><div class="actions">
      <button class="btn" data-act="cos-all"${attr('disabled', allOn)}>${svg(I.unlock)}${t('cos.unlockAll')}</button>
      <button class="btn ghost" data-act="cos-reload"${attr('disabled', S.busy)}>${svg(I.reload)}${t('btn.reload')}</button>
      <button class="btn ghost" data-act="cos-discard"${attr('disabled', !mc.length)}>${t('btn.discard')}</button>
      <button class="btn primary" data-act="cos-open-write"${attr('disabled', !mc.length || S.busy)}>${t('btn.write')}${mc.length ? html` <span class="badge">${mc.length}</span>` : ''}</button>
    </div></div></section>
    <div class="body"><div class="content">
      ${S.server.cosmeticsLockable ? '' : notice('warn', t('cos.noLock'))}
      <div class="hstack gap-12">${searchBox('cos-search', 'cos-search', f.q, t('cos.search'), t('cos.searchLabel'))}
        <label class="small muted hstack">${t('cos.type')} <select class="select" data-fk="cos-type" data-sel="cos-type">
          <option value="">${t('cos.allTypes')}</option>${types.map(ty => html`<option${attr('selected', ty === f.type)}>${ty}</option>`)}</select></label></div>
      ${filterRow('cos-cat-label', t('filter.category'), cats)}
      ${rarities ? filterRow('cos-rar-label', t('filter.rarity'), rarities) : ''}
      ${filterRow('cos-show-label', t('filter.status'), shows)}
      <div class="between"><div class="small muted">${t('cos.shown', { n: fmt(shown.length) })}</div>
        <button class="btn sm" data-act="cos-view-on"${attr('disabled', !offShown)}>${t('cos.unlockShown', { n: fmt(offShown) })}</button></div>
      ${shown.length ? html`<div class="grid cos">${cards}</div>` : html`<div class="empty">${t('cos.noHits')}</div>`}
    </div>${viewCosAside(mc)}</div>`;
}

function viewCosAside(mc) {
  const cos = id => COS().find(c => c.id === id) || { name: '#' + id, type: '' };
  const items = mc.slice(0, 60).map(c => changeRow(
    { label: cos(c.id).name, from: cos(c.id).type, to: t(c.on ? 'cos.toUnlock' : 'cos.toLock'), dot: c.on ? 'var(--accent)' : 'var(--removed)' },
    { act: 'cos-toggle', cid: c.id, where: 'aside' }));
  const backups = (S.metaBackups || []).slice(0, 8).map((b, i) => html`<div class="change vstack metabackup">
    <div><div class="text-13">${backupShortLabel(b)}</div>
    <div class="small muted">${fmtTime(b.mtime)} · ${b.ok ? t('cos.backupUnlocked', { n: fmt(b.unlocked) }) : t('backups.broken')}</div></div>
    <button class="btn sm" data-act="meta-restore" data-i="${i}"${attr('disabled', !b.ok)}>${t('btn.restore')}</button></div>`);
  const strong = key => html`<strong class="strong">${t(key)}</strong>`;
  return html`<aside class="aside" aria-label="${t('cos.asideLabel')}">
    <div class="card${mc.length ? ' changed' : ''}"><div class="between"><h2 class="caps">${t('aside.title')}</h2><span class="badge${mc.length ? ' on' : ''}">${mc.length}</span></div>
      ${mc.length ? html`<div class="changes" data-keep-scroll="cos-changes">${items}${mc.length > 60 ? html`<div class="small muted more">${t('common.more', { n: fmt(mc.length - 60) })}</div>` : ''}</div>
        <button class="btn primary wide mt-12" data-act="cos-open-write" data-where="aside"${attr('disabled', S.busy)}>${t('btn.write')}</button>`
        : html`<p class="muted mt-12">${t('aside.nothing')}</p>`}</div>
    ${notice('info', t('cos.noteProfile'))}
    ${notice('info', tx('cos.noteRarity', { rarity: strong('cos.noteRarityWord'), fixed: strong('cos.noteFixedWord') }))}
    <div class="card"><div class="between"><h2 class="caps">${t('cos.backups')}</h2><button class="btn sm ghost" data-act="open-folder" data-what="meta-backups">${svg(I.folder, 14)}${t('cos.folder')}</button></div>
      <div class="changes">${backups.length ? backups : html`<div class="small muted">${t('cos.noBackups')}</div>`}</div></div>
  </aside>`;
}

function viewAside(chg) {
  const items = chg.map((c, i) => changeRow(c, c.undo ? { act: 'undo', i } : null));
  const steps = [
    ['how.1', S.autoBackup ? 'how.1.on' : 'how.1.off'],
    ['how.2', 'how.2.text'],
    ['how.3', 'how.3.text'],
    ['how.4', 'how.4.text']
  ];
  return html`<aside class="aside" aria-label="${t('aside.label')}">
    <div class="card${chg.length ? ' changed' : ''}">
      <div class="between"><h2 class="caps">${t('aside.title')}</h2><span class="badge${chg.length ? ' on' : ''}">${chg.length}</span></div>
      ${chg.length ? html`<div class="changes" data-keep-scroll="changes">${items}</div>
        <button class="btn primary wide mt-12" data-act="open-write" data-where="aside"${attr('disabled', S.busy)}>${t('btn.write')}</button>`
        : html`<p class="muted mt-12">${t('aside.nothingSave')}</p>`}
    </div>
    <div class="card"><h2 class="caps">${t('how.title')}</h2><ol class="steps">
      ${steps.map(([title, text], i) => html`<li><span class="num">${i + 1}</span>
        <span><strong class="strong">${t(title)}</strong><br><span class="small muted">${t(text)}</span></span></li>`)}
    </ol>${S.server.gameRunning ? '' : html`<div class="small dim mt-12">${t('how.close')}</div>`}</div>
    ${S.server.gameRunning ? notice('warn', t('aside.running')) : ''}
  </aside>`;
}

function dialog({ title, lead, body = '', actions, wide = false }) {
  return html`<div class="overlay" data-act="overlay"><div class="dialog${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <div><h2 id="dlg-title">${title}</h2>${lead ? html`<p class="muted mt-6">${lead}</p>` : ''}</div>
    ${body}<div class="actions end">${actions}</div></div></div>`;
}
const cancelButton = () => html`<button class="btn" data-act="close-modal">${t('btn.cancel')}</button>`;
const confirmButton = (act, label, disabled, danger) => html`<button class="btn ${danger ? 'danger' : 'primary'}" data-act="${act}" data-primary="1"${attr('disabled', disabled)}>${label}</button>`;

function viewModal(chg) {
  const M = S.modal;
  if (!M) return '';
  const st = S.server;
  const running = gameBlocked();
  const backupPath = name => displayPath(st.backupDir) + '\\' + name + '\\' + nextBackupName();
  const backupBox = (state) => html`<div class="pathbox">
      <div><div class="muted">${t('dlg.backup')}</div><div class="mono">${M.backup.file}</div></div>
      <div><div class="muted">${t('dlg.state')}</div><div>${state}</div></div>
    </div>`;
  const MODALS = {
    write: () => dialog({
      title: t('dlg.write.title'),
      lead: t('dlg.write.lead', { changes: tp('n.changeWill', chg.length), team: S.edit.team }),
      body: html`${changeList(chg, 8)}${writeTargets(backupPath(S.saveId), S.loaded.file)}${runningNote()}${wipNote()}
        ${rawDirty() ? notice('info', t('dlg.write.rawLost')) : ''}`,
      actions: html`${cancelButton()}${confirmButton('confirm-write', t(S.busy ? 'btn.writing' : 'btn.writeNow'), running || S.busy)}`
    }),
    // M.group is set when the backup comes from "All backups" (any save, not only the open one)
    restore: () => dialog({
      title: t('dlg.restore.title'),
      lead: t('dlg.restore.lead'),
      body: html`${backupBox(backupState(M.backup))}${runningNote()}${chg.length && (!M.group || M.group.id === S.saveId) ? notice('warn', t('dlg.lost')) : ''}`,
      actions: html`${cancelButton()}${confirmButton('confirm-restore', t('btn.restore'), running || S.busy)}`
    }),
    undelete: () => dialog({
      title: t('dlg.undelete.title'),
      lead: t('dlg.undelete.lead', { team: M.group.team || M.group.id }),
      body: html`${backupBox(backupState(M.backup))}${runningNote()}`,
      actions: html`${cancelButton()}${confirmButton('confirm-undelete', t('btn.restore'), running || S.busy)}`
    }),
    compare: () => dialog({
      title: t('dlg.compare.title'),
      lead: t('dlg.compare.lead', { file: M.backup.file }),
      body: M.loading ? html`<div class="empty">${t('dlg.compare.loading')}</div>`
        : M.diff.length ? html`<div class="small muted">${t('dlg.compare.count', { diffs: tp('n.diff', M.diff.length) })}</div>${changeList(M.diff, 200)}`
          : html`<div class="empty">${t('dlg.compare.none')}</div>`,
      actions: html`<button class="btn" data-act="close-modal" data-primary="1">${t('btn.close')}</button>`,
      wide: true
    }),
    duplicate: () => dialog({
      title: t('dlg.dup.title'),
      lead: t('dlg.dup.lead', { team: S.loaded.model.team }),
      body: html`<div class="vstack gap-6">
          <label for="dup-name" class="strong">${t('dlg.dup.name')}</label>
          <input id="dup-name" class="textin" maxlength="${LIM().teamName}" data-fk="dup-name" data-text="dup-name" value="${M.team}">
        </div>
        ${chg.length ? notice('warn', tp('dlg.dup.lost', chg.length)) : ''}
        ${runningNote()}`,
      actions: html`${cancelButton()}${confirmButton('confirm-duplicate', t('btn.duplicate'), S.busy || running || !M.team.trim())}`
    }),
    'profile-new': () => {
      const sp = selPlayer(); // undefined for saves without players
      const opt = (k, label, desc) => html`<label class="option">
        <input type="checkbox" data-fk="prof-${k}" data-check="prof-${k}"${attr('checked', M[k])}>
        <span><strong class="strong">${label}</strong><br><span class="small muted">${desc}</span></span></label>`;
      return dialog({
        title: t('dlg.prof.title'),
        lead: t('dlg.prof.lead', { team: S.edit.team }),
        body: html`<div class="vstack gap-6">
            <label for="prof-name" class="strong">${t('dlg.prof.name')}</label>
            <input id="prof-name" class="textin" maxlength="${LIM().profileName}" data-fk="prof-name" data-text="prof-name" value="${M.name}">
          </div>
          <div class="vstack gap-12">
            ${opt('run', t('dlg.prof.run'), t('dlg.prof.runDesc'))}
            ${sp ? opt('upgrades', t('dlg.prof.up'), t('dlg.prof.upDesc', { name: sp.name })) : ''}
            ${opt('inv', t('dlg.prof.inv'), t('dlg.prof.invDesc'))}
          </div>`,
        actions: html`${cancelButton()}${confirmButton('confirm-profile', t('dlg.prof.save'), !M.name.trim() || !(M.run || M.upgrades || M.inv))}`
      });
    },
    'raw-write': () => dialog({
      title: t('dlg.raw.title'),
      lead: t('dlg.raw.lead'),
      body: html`${writeTargets(backupPath(S.saveId), S.loaded.file)}${runningNote()}`,
      actions: html`${cancelButton()}${confirmButton('confirm-raw', t('btn.writeNow'), running || S.busy)}`
    }),
    'cos-write': () => {
      const mc = metaChanges();
      const plus = mc.filter(c => c.on).length, minus = mc.length - plus;
      const parts = [];
      if (plus) parts.push(tp('n.cosUnlock', plus));
      if (minus) parts.push(tp('n.cosLock', minus));
      return dialog({
        title: t('dlg.cos.title'),
        lead: parts.join(', ') + '.',
        body: html`${writeTargets(displayPath(st.metaBackupDir) + '\\' + nextBackupName(), S.meta.file)}${runningNote()}`,
        actions: html`${cancelButton()}${confirmButton('confirm-cos', t('btn.writeNow'), running || S.busy)}`
      });
    },
    'meta-restore': () => dialog({
      title: t('dlg.meta.title'),
      lead: t('dlg.meta.lead'),
      body: html`${backupBox(t('cos.backupUnlocked', { n: fmt(M.backup.unlocked) }) + ' · ' + fmtTime(M.backup.mtime))}
        ${runningNote()}
        ${metaChanges().length ? notice('warn', t('dlg.meta.lost')) : ''}`,
      actions: html`${cancelButton()}${confirmButton('confirm-meta-restore', t('btn.restore'), running || S.busy)}`
    }),
    confirm: () => dialog({ title: M.title, lead: M.lead, actions: html`${cancelButton()}${confirmButton('confirm-ok', M.okLabel, false, true)}` }),
    info: () => {
      const g = st.game || {};
      const row = (key, v, mono) => html`<div class="muted">${t(key)}</div><div class="${mono ? 'mono' : ''}">${v}</div>`;
      const build = g.build ? g.build + (g.updated ? ' · ' + t('info.updated', { date: fmtTime(g.updated) }) : '') : t('info.unknown');
      const itemCount = C().items.filter(i => !i.disabled).length;
      const wipCount = C().items.filter(i => !i.disabled && i.wip).length;
      const keys = ['savesDir', 'metaFile', 'backupDir', 'gameDir'].map((k, i) => html`${i ? ', ' : ''}<span class="mono">${k}</span>`);
      return dialog({
        title: 'REPO Save Editor',
        lead: t('info.lead') + (st.author ? ' ' + t('info.copyright', { author: st.author }) : ''),
        body: html`<div class="kv">
            ${row('info.version', st.appVersion || '–')}
            ${row('info.build', build)}
            ${row('info.tested', g.testedBuild || '–')}
            ${row('info.gameDir', breakable(displayPath(st.gameDir)) || t('info.notFound'), true)}
            ${row('info.password', t(st.password && st.password.found ? 'info.passwordFound' : 'info.passwordMissing'))}
            ${row('info.saves', breakable(displayPath(st.savesDir)), true)}
            ${row('info.metaFile', breakable(displayPath(st.metaFile)), true)}
            ${row('info.backups', breakable(displayPath(st.backupDir)), true)}
            ${row('info.items', t('info.itemsValue', { n: itemCount, source: t('source.' + C().source) }) + (wipCount ? ', ' + t('info.itemsWip', { n: wipCount }) : ''))}
            ${row('info.cosmetics', t('info.cosmeticsValue', { n: COS().length, source: t('source.' + st.cosmetics.source) }))}
          </div>
          ${buildChanged() ? notice('warn', t('info.updateWarn')) : ''}
          <div class="small muted">${tx('info.config', { config: html`<span class="mono">${displayPath(st.configFile) || 'config.json'}</span>`, keys })}</div>`,
        actions: html`<button class="btn" data-act="close-modal" data-primary="1">${t('btn.close')}</button>`,
        wide: true
      });
    }
  };
  return MODALS[M.type] ? MODALS[M.type]() : '';
}

function renderToast() {
  const box = document.getElementById('toast');
  const toastNow = S.toast;
  box.setAttribute('aria-live', toastNow && toastNow.isError ? 'assertive' : 'polite');
  box.innerHTML = toastNow ? toHtml(html`<div class="toast${toastNow.isError ? ' error' : ''}"><span>${toastNow.text}</span>
    ${toastNow.action ? html`<button data-act="toast-action">${toastNow.action.label}</button>` : ''}<button data-act="toast-close" aria-label="${t('toast.close')}">OK</button></div>`) : '';
}

/** Status message at the bottom. Errors stay until closed; others disappear after a while. */
let toastTimer = null;
function toast(text, isError, action) {
  clearTimeout(toastTimer);
  S.toast = { text, isError: !!isError, action: action || null };
  renderToast();
  if (!isError) toastTimer = setTimeout(() => { S.toast = null; renderToast(); }, TOAST_MS);
}

// ---------- loading --------------------------------------------------------------------------------
async function loadSaves() {
  const [saves, deleted] = await Promise.all([api('GET', '/api/saves'), api('GET', '/api/deleted-saves')]);
  S.saves = saves;
  S.deleted = deleted;
}
async function loadAllBackups() {
  try { S.all.list = await api('GET', '/api/all-backups'); } catch (e) { S.all.list = S.all.list || []; toast(t('msg.backupsFailed', { error: e.message }), true); }
}
/** The game deleted the open save (the team died): say so, and where to get it back. */
function checkOpenSave() {
  if (!S.saveId || S.saves.some(s => s.id === S.saveId)) return;
  if (S.edit && changes().length) { toast(t('msg.openDeleted'), true); return; } // keep the edits on screen
  S.loaded = null; S.edit = null; S.backups = null; S.raw = null;
  S.error = t('msg.openDeleted');
}

let openRequest = 0; // ignores answers of older requests when the user clicks quickly
async function openSave(id) {
  const req = ++openRequest;
  S.view = 'save'; S.saveId = id; S.loaded = null; S.edit = null; S.backups = null; S.raw = null; S.error = null;
  render();
  try {
    const loaded = await api('GET', '/api/save' + idQuery(id));
    if (req !== openRequest) return;
    S.loaded = loaded;
    S.edit = clone(loaded.model);
    if (!S.edit.players.some(p => p.id === S.playerId)) S.playerId = S.edit.players[0] ? S.edit.players[0].id : null;
    if (S.tab === 'backups') loadBackups();
    if (S.tab === 'raw') loadRaw();
  } catch (e) {
    if (req !== openRequest) return;
    S.error = t('nosave.failed', { error: e.message });
  }
  render();
}

async function loadBackups() {
  const id = S.saveId;
  try {
    const list = await api('GET', '/api/backups' + idQuery(id));
    if (id === S.saveId) S.backups = list;
  } catch (e) { S.backups = []; toast(t('msg.backupsFailed', { error: e.message }), true); }
  render();
}

async function loadRaw() {
  const id = S.saveId;
  try {
    const r = await api('GET', '/api/raw' + idQuery(id));
    if (id === S.saveId) S.raw = { hash: r.hash, text: r.text, original: r.text };
  } catch (e) { S.raw = null; toast(t('msg.rawFailed', { error: e.message }), true); }
  render();
}

async function loadMeta() {
  try {
    S.meta = await api('GET', '/api/meta');
    S.metaEdit = new Set(S.meta.unlocks);
    S.metaError = null;
  } catch (e) {
    S.meta = null; S.metaEdit = null; S.metaError = e.message;
  }
  try { S.metaBackups = await api('GET', '/api/meta-backups'); } catch (e) { S.metaBackups = []; }
}

async function loadProfiles() { try { S.profiles = await api('GET', '/api/profiles'); } catch (e) { S.profiles = []; } }
async function saveProfiles(list) { S.profiles = await api('POST', '/api/profiles', { profiles: list }); }

// ---------- writing ----------------------------------------------------------------------------------
/** Runs a write: busy state, dialog closed afterwards, errors as toast (conflicts offer "reload"). */
async function runWrite(fn, failKey, reload) {
  S.busy = true; render();
  let message;
  try {
    message = await fn();
  } catch (e) {
    S.busy = false; S.modal = null; render();
    const conflict = e.reason === 'changed'; // the file changed since loading
    toast(t('msg.failed', { what: t(failKey), error: e.message }), true, conflict ? { label: t('btn.reload'), fn: reload } : null);
    return;
  }
  S.busy = false; S.modal = null;
  toast(message);
  try { await reload(); } catch (e) { toast(t('msg.writtenNoRefresh', { error: e.message }), true); }
  render();
}
const reloadSave = async () => {
  let listError = null;
  try { await loadSaves(); } catch (e) { listError = e; }
  await openSave(S.saveId); // always: otherwise the old hash stays and the next save is refused as a conflict
  if (listError) toast(t('msg.listFailed', { error: listError.message }), true);
};
const reloadMeta = async () => { await loadMeta(); };
/** "Saved. Previous version backed up as …" or "Saved (without backup)" */
const backupMessage = (r, what) => (r.backup ? t('msg.backedUp', { what, file: r.backup }) : t('msg.noBackup', { what }));

// The hash tells the server which version was loaded; it refuses to write if the file changed since.
const doWrite = () => runWrite(async () => {
  const r = await api('POST', '/api/save' + idQuery(S.saveId), { hash: S.loaded.hash, model: S.edit, autoBackup: S.autoBackup });
  return backupMessage(r, t('msg.written'));
}, 'msg.notWritten', reloadSave);

const doRaw = () => runWrite(async () => {
  const r = await api('POST', '/api/raw' + idQuery(S.saveId), { hash: S.raw.hash, text: S.raw.text, autoBackup: S.autoBackup });
  return backupMessage(r, t('msg.rawWritten'));
}, 'msg.notWritten', reloadSave);

/** Restores a backup of the open save or, from "All backups", of any existing save `group`. */
const doRestore = (b, group) => {
  const id = group ? group.id : S.saveId;
  const hash = group ? group.current && group.current.hash : S.loaded.hash;
  return runWrite(async () => {
    const r = await api('POST', '/api/restore' + idQuery(id), { source: b.source, file: b.file, hash });
    return t('msg.restored', { file: r.backup });
  }, 'msg.notRestored', group ? () => reloadAfterRestore(id) : reloadSave);
};
const reloadAfterRestore = async id => {
  await loadSaves();
  await loadAllBackups();
  if (id === S.saveId && !changes().length) { const view = S.view; await openSave(id); S.view = view; }
};
/** Brings back a save the game deleted, from one of its backups, and opens it. */
const doUndelete = (group, b) => runWrite(async () => {
  await api('POST', '/api/restore-deleted' + idQuery(group.id), { file: b.file });
  return t('msg.undeleted', { team: group.team || group.id });
}, 'msg.notRestored', async () => { await loadSaves(); S.all.focus = null; S.all.list = null; await openSave(group.id); });

const doCosWrite = () => runWrite(async () => {
  const r = await api('POST', '/api/meta', { hash: S.meta.hash, unlocks: [...S.metaEdit], autoBackup: S.autoBackup });
  return backupMessage(r, t('msg.cosWritten', { n: fmt(r.unlocked) }));
}, 'msg.notWritten', reloadMeta);

const doMetaRestore = b => runWrite(async () => {
  const r = await api('POST', '/api/meta-restore', { source: b.source, file: b.file, hash: S.meta.hash });
  return t('msg.cosRestored', { file: r.backup });
}, 'msg.notRestored', reloadMeta);

async function doDuplicate() {
  const team = S.modal.team.trim();
  let newId = null;
  await runWrite(async () => {
    newId = (await api('POST', '/api/duplicate' + idQuery(S.saveId), { team })).id;
    return t('msg.duplicated', { team });
  }, 'msg.dupFailed', async () => { await loadSaves(); if (newId) await openSave(newId); });
}

async function openCompare(b) {
  openModal({ type: 'compare', backup: b, loading: true, diff: [] });
  render();
  try {
    const r = await api('GET', '/api/backup-model' + idQuery(S.saveId) + '&source=' + encodeURIComponent(b.source) + '&file=' + encodeURIComponent(b.file));
    if (S.modal && S.modal.type === 'compare') { S.modal.diff = diffModels(r.model, S.loaded.model); S.modal.loading = false; }
  } catch (e) { S.modal = null; toast(t('msg.compareFailed', { error: e.message }), true); }
  render();
}

/** Asks before discarding unwritten edits (model or expert text), then runs `then`. */
function guardUnsaved(titleKey, okKey, then) {
  const n = changes().length;
  if (!n && !rawDirty()) return then();
  const lead = n ? tp('guard.lead', n, { team: S.edit.team }) : t('guard.raw');
  confirmModal(t(titleKey), lead, t(okKey), then);
}

function editRun(key, fn) {
  const f = runField(key);
  S.edit.run[key] = clampTo(fn(S.edit.run[key]), f.min, f.max);
}

// ---------- actions (data-act) -------------------------------------------------------------------------
const ACTIONS = {
  'overlay': () => closeModal(),
  'close-modal': () => closeModal(),
  'toast-close': () => { S.toast = null; renderToast(); return NO_RENDER; },
  'toast-action': () => { const a = S.toast && S.toast.action; S.toast = null; renderToast(); if (a) a.fn().then(render).catch(e => toast(e.message, true)); return NO_RENDER; },
  'info': () => openModal({ type: 'info' }),
  'confirm-ok': () => { const fn = S.modal.onOk; S.modal = null; return fn(); },

  // language: stored by the server; lists are fetched again for messages in the new language
  'lang': async d => {
    if (d.lang === S.lang) return;
    setLanguage(d.lang);
    if (S.toast && !S.toast.isError) S.toast = null; // a passing message in the old language
    render();
    try {
      await api('POST', '/api/settings', { language: S.lang });
    } catch (e) {
      toast(t('msg.settingFailed', { error: e.message }), true);
    }
    try { await loadSaves(); } catch (e) { /* the list stays as it is */ }
    if (S.tab === 'backups' && S.backups) await loadBackups();
  },

  // navigation
  'view-backups': async d => {
    S.view = 'backups';
    S.all.focus = d.id || null;
    render();
    await loadAllBackups();
  },
  'all-show': d => { S.all.show = d.show; },
  'all-unfocus': () => { S.all.focus = null; },
  'all-more': d => { S.all.more.push(d.id); },
  'all-reload': async () => { await loadAllBackups(); toast(t('msg.reloaded')); },
  'all-restore': d => {
    const group = (S.all.list || []).find(g => g.id === d.id);
    const backup = group && group.backups.find(b => b.file === d.file && b.source === d.source);
    if (backup) openModal({ type: 'restore', backup, group });
  },
  'all-undelete': d => {
    const group = (S.all.list || []).find(g => g.id === d.id);
    const backup = group && group.backups.find(b => b.file === d.file);
    if (backup) openModal({ type: 'undelete', backup, group });
  },
  'confirm-undelete': () => doUndelete(S.modal.group, S.modal.backup),
  'view-cosmetics': async () => {
    S.view = 'cosmetics';
    if (!metaChanges().length) await loadMeta(); // fresh from disk unless there are pending edits
  },
  'select-save': d => {
    if (d.id === S.saveId) { S.view = 'save'; return; }
    return guardUnsaved('guard.discardTitle', 'guard.discardSwitch', () => openSave(d.id));
  },
  'reload-saves': async () => {
    try {
      const r = await api('POST', '/api/rescan', {});
      S.saves = r.saves;
      S.deleted = r.deleted;
      S.server.savesDirExists = r.savesDirExists;
      S.server.password = r.password;
      if (S.metaError && r.metaExists) await loadMeta();
      if (!S.saveId) S.error = null;
      if (!S.saveId && S.saves.length) await openSave((S.saves.find(x => x.ok) || S.saves[0]).id); // first save appeared
      if (S.view === 'backups') await loadAllBackups();
      checkOpenSave();
      toast(r.made.length ? tp('msg.listMade', r.made.length) : r.updated.length ? tp('msg.listSnapshots', r.updated.length) : t('msg.listUpdated'));
    } catch (e) { toast(t('msg.listFailed', { error: e.message }), true); }
  },
  'reload-save': () => guardUnsaved('guard.reloadTitle', 'guard.discardReload', async () => {
    await openSave(S.saveId);
    toast(t('msg.reloaded'));
  }),
  'tab': d => {
    S.tab = d.tab;
    if (S.tab === 'backups') { S.backups = null; loadBackups(); }
    if (S.tab === 'raw' && !rawDirty()) { S.raw = null; loadRaw(); }
  },
  'open-folder': async d => {
    // scope "save": the folder of the open save instead of the main folder
    const query = d.scope === 'save' && S.saveId ? idQuery(S.saveId) : '';
    try {
      await api('POST', '/api/open' + query, { what: d.what });
    } catch (e) {
      toast(t('msg.folderFailed', { error: e.message }), true);
    }
    return NO_RENDER;
  },

  // run values
  'run-add': d => editRun(d.k, v => v + Number(d.add)),
  'run-reset': d => { S.edit.run[d.k] = S.loaded.model.run[d.k]; },
  'price-add': d => {
    const counts = S.edit.upgradesPurchased;
    counts[d.key] = clampTo(count(counts, d.key) + Number(d.add), 0, LIM().purchases);
  },
  'price-reset': () => {
    for (const k of Object.keys(S.edit.upgradesPurchased)) S.edit.upgradesPurchased[k] = 0;
  },

  // players
  'player': d => { S.playerId = d.id; },
  'hp-add': d => {
    const p = selPlayer();
    p.hp = clampTo((p.hp || 0) + Number(d.add), 0, LIM().hp);
  },
  'hp-full': () => {
    const p = selPlayer();
    p.hp = clampTo(maxHp(p), 0, LIM().hp);
  },
  'up-add': d => {
    const p = selPlayer();
    p.up[d.f] = clampTo((p.up[d.f] || 0) + Number(d.add), 0, LIM().upgradeLevel);
  },
  'all-plus': () => {
    const p = selPlayer();
    for (const f of S.edit.upgradeFields) p.up[f] = clampTo((p.up[f] || 0) + 1, 0, LIM().upgradeLevel);
  },
  'all-ten': () => {
    const p = selPlayer();
    for (const f of S.edit.upgradeFields) p.up[f] = Math.max(p.up[f] || 0, 10);
  },
  'copy-all': () => {
    const p = selPlayer();
    confirmModal(t('copyAll.title'), t('copyAll.lead', { name: p.name }), t('copyAll.ok'), () => {
      for (const x of S.edit.players) x.up = Object.assign({}, p.up);
      toast(t('copyAll.done', { name: p.name }));
    });
  },

  // items
  'item-cat': d => { S.items.cat = d.cat; },
  'inv-add': d => {
    const v = clampTo(count(S.edit.inv, d.key) + Number(d.add), 0, LIM().itemCount);
    if (v > 0) S.edit.inv[d.key] = v; else delete S.edit.inv[d.key];
  },
  'fill-batt': () => { S.edit.fillBatteries = !S.edit.fillBatteries; },

  // changes and writing
  'undo': d => {
    const c = changes()[Number(d.i)]; // same order as the list on screen
    if (c && c.undo) c.undo(S.edit);
  },
  'discard': () => {
    confirmModal(t('guard.discardTitle'), tp('discard.lead', changes().length), t('btn.discard'), () => {
      S.edit = clone(S.loaded.model);
      toast(t('msg.discarded'));
    });
  },
  'open-write': () => openModal({ type: 'write' }),
  'confirm-write': () => doWrite(),
  'open-duplicate': () => openModal({ type: 'duplicate', team: t('dlg.dup.default', { team: S.loaded.model.team || t('dlg.dup.fallback') }) }),
  'confirm-duplicate': () => doDuplicate(),

  // backups
  'backup-now': async () => {
    try {
      const r = await api('POST', '/api/backup' + idQuery(S.saveId), {});
      await loadSaves();
      if (S.tab === 'backups') await loadBackups();
      toast(t('msg.backupCreated', { file: r.backup }));
    } catch (e) { toast(t('msg.backupFailed', { error: e.message }), true); }
  },
  'restore': d => openModal({ type: 'restore', backup: S.backups[Number(d.i)] }),
  'confirm-restore': () => doRestore(S.modal.backup, S.modal.group),
  'compare': d => { openCompare(S.backups[Number(d.i)]); return NO_RENDER; },

  // profiles
  'profile-apply': d => {
    const p = builtinProfiles().concat(S.profiles).find(x => x.id === d.pid);
    if (!p) return;
    applyProfile(p);
    toast(t('msg.profApplied', { name: p.name }));
  },
  'profile-delete': d => {
    const p = S.profiles.find(x => x.id === d.pid);
    if (!p) return;
    confirmModal(t('profDelete.title'), t('profDelete.lead', { name: p.name }), t('prof.delete'), async () => {
      try {
        await saveProfiles(S.profiles.filter(x => x.id !== d.pid));
        toast(t('msg.profDeleted'));
      } catch (e) {
        toast(t('msg.profDeleteFailed', { error: e.message }), true);
      }
    });
  },
  'profile-new': () => openModal({ type: 'profile-new', name: t('dlg.prof.default', { team: S.edit.team }), run: true, upgrades: !!selPlayer(), inv: false }),
  'confirm-profile': async () => {
    const M = S.modal, e = S.edit;
    const p = { id: 'p' + Date.now(), name: M.name.trim(), run: null, upgrades: null, inv: null };
    if (M.run) p.run = Object.assign({}, e.run);
    if (M.upgrades && selPlayer()) p.upgrades = Object.assign({}, selPlayer().up);
    if (M.inv) p.inv = Object.assign({}, e.inv);
    try {
      await saveProfiles(S.profiles.concat([p]));
      S.modal = null;
      toast(t('msg.profSaved', { name: p.name }));
    } catch (err) {
      toast(t('msg.profSaveFailed', { error: err.message }), true);
    }
  },

  // expert mode
  'raw-reload': () => {
    const reload = () => { S.raw = null; loadRaw(); };
    if (!rawDirty()) return reload();
    confirmModal(t('rawReload.title'), t('rawReload.lead'), t('btn.reload'), reload);
  },
  'raw-write': () => openModal({ type: 'raw-write' }),
  'confirm-raw': () => doRaw(),

  // cosmetics
  'cos-cat': d => { S.cos.cat = d.cat; S.cos.type = ''; },
  'cos-show': d => { S.cos.show = d.show; },
  'cos-rarity': d => { S.cos.rarity = d.rarity === 'all' ? 'all' : Number(d.rarity); },
  'cos-toggle': d => {
    const id = Number(d.cid);
    if (S.meta.equipped.includes(id)) return;
    if (!S.server.cosmeticsLockable && S.meta.unlocks.includes(id)) return;
    if (S.metaEdit.has(id)) S.metaEdit.delete(id); else S.metaEdit.add(id);
  },
  'cos-all': () => { COS().forEach(c => S.metaEdit.add(c.id)); },
  'cos-view-on': () => { COS().filter(cosFilter(true)).forEach(c => S.metaEdit.add(c.id)); },
  'cos-discard': () => {
    confirmModal(t('guard.discardTitle'), tp('cosDiscard.lead', metaChanges().length), t('btn.discard'), () => { S.metaEdit = new Set(S.meta.unlocks); });
  },
  'cos-reload': () => {
    const reload = async () => { await loadMeta(); toast(t('msg.reloaded')); };
    if (!metaChanges().length) return reload();
    confirmModal(t('guard.reloadTitle'), t('cosReload.lead'), t('guard.discardReload'), reload);
  },
  'cos-open-write': () => openModal({ type: 'cos-write' }),
  'confirm-cos': () => doCosWrite(),
  'meta-restore': d => openModal({ type: 'meta-restore', backup: S.metaBackups[Number(d.i)] }),
  'confirm-meta-restore': () => doMetaRestore(S.modal.backup)
};

function closeModal() {
  if (S.busy) return NO_RENDER;
  S.modal = null;
}

// A number is applied on its change event, which fires when the input loses focus. If that happens
// because a button is being pressed, re-rendering now would replace the button and swallow its click.
// So: while a pointer is down on an action, the click renders; otherwise render after focus has moved.
let pressedAction = null;
document.addEventListener('pointerdown', e => { pressedAction = e.target.closest ? e.target.closest('[data-act]') : null; }, true);
document.addEventListener('pointerup', () => setTimeout(() => {
  if (pressedAction) { pressedAction = null; render(); } // pressed but no click (pointer moved away)
}), true);

document.addEventListener('click', async e => {
  pressedAction = null;
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (act === 'overlay' && e.target !== el) return; // clicks inside the dialog
  const handler = ACTIONS[act];
  if (!handler) return;
  const result = await handler(el.dataset, el);
  if (result !== NO_RENDER) render();
});

document.addEventListener('input', e => {
  const d = e.target.dataset;
  if (!d) return;
  if (d.raw) {
    // expert textarea: update state and the status line only (re-rendering would be slow and jumpy)
    S.raw.text = e.target.value;
    const r = rawState();
    const status = document.getElementById('raw-status');
    if (status) { status.textContent = r.msg; status.style.color = r.ok ? (r.changed ? 'var(--accent)' : 'var(--ok)') : 'var(--bad)'; }
    const btn = document.getElementById('raw-write');
    if (btn) btn.disabled = rawButtonDisabled();
    return;
  }
  const setters = {
    team: v => { S.edit.team = v; },
    'item-search': v => { S.items.q = v; },
    'cos-search': v => { S.cos.q = v; },
    'all-search': v => { S.all.q = v; },
    'dup-name': v => { S.modal.team = v; },
    'prof-name': v => { S.modal.name = v; }
  };
  if (!setters[d.text]) return;
  setters[d.text](e.target.value);
  render();
});

document.addEventListener('change', e => {
  const d = e.target.dataset;
  if (!d) return;
  if (d.check === 'autobackup') {
    S.autoBackup = e.target.checked;
    api('POST', '/api/settings', { autoBackup: S.autoBackup })
      .catch(err => toast(t('msg.settingFailed', { error: err.message }), true));
  } else if (d.check === 'crown') {
    const p = selPlayer(), on = e.target.checked;
    S.edit.players.forEach(x => { x.crown = false; }); // only one player can have the crown
    p.crown = on;
  } else if (d.check && d.check.startsWith('prof-')) {
    S.modal[d.check.slice(5)] = e.target.checked;
  } else if (d.sel === 'cos-type') {
    S.cos.type = e.target.value;
  } else if (d.num) {
    const [kind, key] = d.num.split(/:(.*)/); // "up:playerUpgradeHealth" -> ["up", "playerUpgradeHealth"]
    const v = parseNum(e.target.value);
    if (v !== null) {
      if (kind === 'run') editRun(key, () => v);
      if (kind === 'hp') selPlayer().hp = clampTo(v, 0, LIM().hp);
      if (kind === 'up') selPlayer().up[key] = clampTo(v, 0, LIM().upgradeLevel);
    }
    // empty or invalid input shows the previous value again; see pressedAction above for the timing
    if (!pressedAction) setTimeout(() => render({ committed: true }));
    return;
  } else return;
  render();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.modal && !S.busy) { S.modal = null; render(); return; }
  const d = e.target.dataset || {};
  if (e.key === 'Enter' && d.num) { e.target.dispatchEvent(new Event('change', { bubbles: true })); return; }
  if (e.key === 'Enter' && S.modal && e.target.tagName === 'INPUT' && e.target.type === 'text') {
    const primary = document.querySelector('.dialog [data-primary]');
    if (primary && !primary.disabled) primary.click(); // Enter confirms text dialogs
  }
});

window.addEventListener('beforeunload', e => {
  if (changes().length || metaChanges().length || rawDirty()) { e.preventDefault(); e.returnValue = ''; }
});

/** Keeps the "game running" indicator and the lists current (the game saves, or deletes a save). */
async function pollStatus() {
  const r = await api('GET', '/api/status');
  let changed = r.gameRunning !== S.server.gameRunning;
  S.server.gameRunning = r.gameRunning;
  if (S.savesRevision !== null && r.savesRevision !== S.savesRevision && !S.busy) {
    await loadSaves();
    if (S.view === 'backups') await loadAllBackups();
    checkOpenSave();
    changed = true;
  }
  if (!S.busy) S.savesRevision = r.savesRevision;
  if (changed) render();
}
setInterval(async () => {
  if (!S.server || document.hidden) return;
  try { await pollStatus(); } catch (e) { /* editor stopped */ }
}, POLL_MS);

(async function init() {
  setLanguage(systemLanguage()); // until the stored choice is known
  render();
  try {
    if (!TOKEN) throw new Error(t('boot.noToken'));
    const state = await api('GET', '/api/state');
    setLanguage(state.settings.language || systemLanguage());
    S.server = state;
    S.autoBackup = state.settings.autoBackup;
    await Promise.all([loadMeta(), loadProfiles()]);
    try {
      await loadSaves();
    } catch (e) {
      S.error = t('nosave.listFailed', { error: e.message }); // "Refresh list" tries again
    }
    render();
    const first = S.saves.find(s => s.ok) || S.saves[0];
    if (first) await openSave(first.id);
  } catch (e) {
    S.error = t('boot.failed', { error: e.message });
    render();
  }
})();
</script>
</body>
