<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REPO Save Editor</title>
<style>
/* Fonts ship with the app (SIL Open Font License, see fonts/OFL-LICENSES.txt) */
@font-face { font-family: 'Chakra Petch'; font-weight: 500; font-display: swap; src: url(/fonts/chakra-petch-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Chakra Petch'; font-weight: 600; font-display: swap; src: url(/fonts/chakra-petch-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Chakra Petch'; font-weight: 700; font-display: swap; src: url(/fonts/chakra-petch-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-weight: 400; font-display: swap; src: url(/fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-weight: 500; font-display: swap; src: url(/fonts/ibm-plex-sans-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-weight: 600; font-display: swap; src: url(/fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 400; font-display: swap; src: url(/fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 500; font-display: swap; src: url(/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2'); }

:root {
  color-scheme: dark;
  --bg: #111214; --bg2: #141518; --top: #16171A; --panel: #1A1C20; --panel2: #1F2226; --raise: #22252A; --chip: #26292F;
  --line: #2A2D33; --line2: #33373E; --line3: #3A3F46; --field-line: #646A74;
  --text: #ECEAE4; --soft: #C9CDD3; --muted: #9BA0A8; --dim: #8A9099;
  --accent: #F5A524; --on-accent: #17120A; --info: #6FB8FF; --info-bg: #1C2530; --info-fg: #BFDDFF;
  --warn-bg: #2A2113; --warn-fg: #F7DDB0; --bad: #FF8A7A; --bad-bg: #2E1A1A; --bad-fg: #FFD3CC; --ok: #5FD1A8;
  --crown: #E8C468; --kept: #CFD6DF; --removed: #7A3B3B; --code-bg: #0D0E10;
  --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
  --display: 'Chakra Petch', 'Segoe UI', sans-serif;
  --sans: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
body { min-height: 100vh; display: flex; flex-direction: column; }
#app { flex: 1; display: flex; flex-direction: column; }
h1, h2, h3, p { margin: 0; }
button, select { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .4; }
button:not(:disabled):hover { filter: brightness(1.18); }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; flex: none; }
::placeholder { color: #7E848C; }

/* small utilities */
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.small { font-size: 12px; }
.strong { font-weight: 600; }
.plain { font-weight: 400; }
.shrink { min-width: 0; }
.wrap { overflow-wrap: anywhere; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.caps { font-family: var(--display); font-weight: 600; font-size: inherit; letter-spacing: .08em; text-transform: uppercase; }
.vstack { display: flex; flex-direction: column; gap: 10px; }
.hstack { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.fill { flex: 1; }
.noshrink { flex: none; }
.gap-0 { gap: 0; }
.gap-6 { gap: 6px; }
.gap-12 { gap: 12px; }
.mt-6 { margin-top: 6px; }
.mt-12 { margin-top: 12px; }
.inset { padding: 0 4px; }
.text-13 { font-size: 13px; }
.figure { font-family: var(--display); font-weight: 700; }
.c-accent { color: var(--accent); }
.c-ok { color: var(--ok); }
.c-bad { color: var(--bad); }
.c-info { color: var(--info); }
.c-soft { color: var(--soft); }
.c-crown { color: var(--crown); }
/* a checkbox with its label text */
.option { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }

/* top bar */
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 14px 24px; background: var(--top); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.brand-name { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .08em; }
.top-right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13px; border: 0; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.pill.warn { background: var(--warn-bg); color: var(--warn-fg); }
.pill.warn .dot { background: var(--accent); }
.pill.info { background: var(--info-bg); color: var(--info-fg); }
.pill.info .dot { background: var(--info); }
.pathchip { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); font-family: var(--mono); font-size: 12px; color: var(--soft); max-width: 100%; min-width: 0; }
.pathchip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* buttons */
.btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line3); background: var(--panel2); display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn.sm { min-height: 36px; padding: 0 12px; border-radius: 8px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--soft); }
.btn.primary { border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.danger { border-color: #8A4A42; color: var(--bad-fg); }
.btn.wide { width: 100%; }
.badge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; font-size: 12px; font-weight: 600; display: inline-grid; place-items: center; background: var(--chip); color: var(--muted); }
.badge.on { background: var(--accent); color: var(--on-accent); }
.btn.primary .badge { background: var(--on-accent); color: var(--accent); }
.iconbtn { width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; flex: none; }
.iconbtn.accent { background: var(--chip); color: var(--accent); }
.step { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--field-line); background: var(--raise); display: grid; place-items: center; flex: none; }
.step.sm { width: 36px; height: 36px; border-radius: 8px; }
.step.xs { width: 30px; height: 30px; border-radius: 7px; }

/* layout */
.layout { flex: 1; display: flex; flex-wrap: wrap; align-items: stretch; }
.sidebar { flex: 1 1 260px; padding: 20px 16px; background: var(--bg2); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 20px; }
.main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; }
.savebtn { width: 100%; text-align: left; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent; display: flex; flex-direction: column; gap: 4px; }
.savebtn.active { border-color: var(--accent); background: var(--panel2); }
.savebtn.deleted { border-style: dashed; }
.savebtn .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.lvl { font-family: var(--display); font-weight: 600; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--chip); flex: none; }
.card { padding: 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.card.changed { border-color: var(--accent); }
.card.upcard { padding: 14px 16px; }
.card.battery { flex-wrap: wrap; gap: 12px; }
.savehead { padding: 24px 28px 0; display: flex; flex-direction: column; gap: 18px; }
.headrow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; }
h1 { margin-top: 6px; font-family: var(--display); font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: .02em; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 8px; color: var(--muted); }
.meta strong { color: var(--text); font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions.rawbar { align-items: center; }
.actions.end { justify-content: flex-end; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { min-height: 44px; padding: 10px 14px; margin-bottom: -1px; background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 8px; }
.tab[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); }
.tab .badge { font-family: var(--sans); font-size: 11px; min-width: 20px; height: 20px; }
.body { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px 28px 48px; align-items: flex-start; }
.body.notice-only { padding-bottom: 0; }
.content { flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.aside { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 16px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.grid.up { gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.grid.items { gap: 12px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.grid.cos { gap: 10px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.grid.prices { gap: 8px 16px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.grid.profiles { gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }

/* fields */
.field-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.key { font-family: var(--mono); font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
.stepper { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
.bignum { flex: 1; min-width: 0; width: 100%; text-align: center; font-family: var(--display); font-size: 30px; font-weight: 700; background: transparent; border: 0; color: var(--text); padding: 0; }
.foot { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { min-height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--field-line); background: transparent; color: var(--soft); font-size: 12px; }
.textin { min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--field-line); background: var(--bg); color: var(--text); font: inherit; font-size: 16px; width: 100%; }
.select { min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--field-line); background: var(--panel); color: var(--text); }
.rowlabel { width: 80px; }
.teamrow { gap: 12px 20px; }
.teamrow > .vstack { flex: 1 1 260px; }

/* players */
.players { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.pbtn { text-align: left; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); display: flex; align-items: center; gap: 12px; min-height: 64px; }
.pbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--raise); }
.avatar { width: 40px; height: 40px; border-radius: 10px; color: #111214; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 18px; flex: none; }
.cdot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
.toolbar { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; justify-content: space-between; }
.hpbar { gap: 16px 28px; }
.crownopt { align-items: center; min-height: 44px; }
.mini { display: flex; align-items: center; gap: 4px; flex: none; }
.mini .heal { margin-left: 8px; }
.midnum { width: 48px; text-align: center; font-family: var(--display); font-size: 20px; font-weight: 700; background: transparent; border: 0; color: var(--text); padding: 0; }
.midnum.wide { width: 72px; }
.midnum.c-accent { color: var(--accent); }
.pips { display: flex; align-items: center; gap: 4px; margin-top: 12px; }
.pip { flex: 1; height: 8px; border-radius: 2px; background: var(--line2); }
.pip.kept { background: var(--kept); }
.pip.added { background: var(--accent); }
.pip.removed { background: var(--removed); }
.pips .note { min-width: 70px; text-align: right; }
.pricerow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.pricerow .name { font-weight: 500; }
.pricenum { min-width: 34px; text-align: center; }

/* items and cosmetics */
.search { position: relative; flex: 1 1 260px; min-width: 0; }
.search svg { position: absolute; left: 12px; top: 13px; }
.search input { width: 100%; min-height: 44px; padding: 0 12px 0 40px; border-radius: 10px; border: 1px solid var(--field-line); background: var(--panel); color: var(--text); font: inherit; }
.catbtn { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--field-line); background: transparent; color: var(--soft); display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.catbtn[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
.catbtn .count { opacity: .7; }
.sq { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.itemcard { padding: 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.itemcard.owned { background: var(--panel2); border-color: var(--line3); }
.itemcard.changed { border-color: var(--accent); }
.itemtop { display: flex; gap: 12px; align-items: center; }
.itemicon { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.itemkey { font-family: var(--mono); font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.addbtn { min-height: 40px; border-radius: 8px; border: 1px dashed var(--field-line); background: transparent; color: var(--soft); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.countbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px; border-radius: 8px; background: var(--bg); }
.countbar .step { border: 0; border-radius: 6px; }
.countmid { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.countmid .count { font-size: 18px; }
.countmid .note { font-size: 11px; }
.truckchip { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line2); background: var(--raise); font-size: 13px; }
.truckchip.changed { border-color: var(--accent); }
.truckhead { flex-wrap: wrap; align-items: baseline; }
.coscard { text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 4px; min-height: 64px; }
.coscard.on { background: var(--panel2); border-color: var(--line3); }
.coscard.changed { border-color: var(--accent); }
.coscard:disabled { opacity: .85; cursor: default; }
.coscard .st { font-size: 11px; display: inline-flex; align-items: center; gap: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.rar { font-size: 11px; line-height: 1.5; padding: 0 6px; border-radius: 5px; font-weight: 500; }
.rar.fixed { color: var(--soft); background: var(--chip); }

/* backups table */
.table { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.trow { display: grid; grid-template-columns: 130px 200px minmax(0, 1fr) 48px 90px auto; gap: 12px; padding: 10px 16px; align-items: center; border-top: 1px solid var(--line); }
.trow.head { border-top: 0; background: var(--top); font-size: 12px; color: var(--muted); }
.trow .acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
.tag.accent { background: var(--accent-soft); color: var(--accent); }
.tag.info { background: var(--info-bg); color: var(--info-fg); }
.tag.bad { background: var(--bad-bg); color: var(--bad-fg); }
.tag.warn { background: var(--warn-bg); color: var(--warn-fg); }
.trow .caps-num { font-family: var(--display); font-weight: 600; }
.trow .file { color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* changes, notices, dialogs */
.changes { display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow-y: auto; margin-top: 12px; }
.change { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 8px; background: var(--raise); }
.change .lbl, .change .val { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.change.metabackup { align-items: stretch; gap: 6px; }
.more { padding: 0 10px; }
.changes > .more { padding: 4px 10px; }
.steps { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
.steps li { display: flex; gap: 12px; }
.num { width: 24px; height: 24px; border-radius: 6px; background: var(--chip); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 13px; flex: none; }
.notice { padding: 14px 16px; border-radius: 12px; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.notice > svg { flex: none; margin-top: 1px; }
.notice.warn { background: var(--warn-bg); color: var(--warn-fg); }
.notice.info { background: var(--info-bg); color: #D6E8FF; }
.rawbox { width: 100%; min-height: 60vh; resize: vertical; padding: 14px; border-radius: 12px; border: 1px solid var(--field-line); background: var(--code-bg); color: var(--soft); font-family: var(--mono); font-size: 12.5px; line-height: 1.5; tab-size: 2; white-space: pre; }
.overlay { position: fixed; inset: 0; background: rgba(8, 9, 10, .74); display: grid; place-items: center; padding: 16px; z-index: 50; }
.dialog { width: 100%; max-width: 580px; max-height: calc(100vh - 32px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.dialog.wide { max-width: 760px; }
.dialog h2 { font-family: var(--display); font-size: 24px; font-weight: 700; }
.pathbox { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 10px; background: var(--bg); font-size: 13px; }
.pathbox .mono { font-size: 12px; color: var(--soft); overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: 170px 1fr; gap: 8px 16px; font-size: 13px; }
.kv .mono { font-size: 12px; color: var(--soft); overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); padding: 12px 12px 12px 16px; border-radius: 12px; background: var(--text); color: var(--bg); display: flex; align-items: center; gap: 10px; z-index: 60; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); }
.toast.error { background: var(--bad-fg); color: #2E1A1A; }
.toast button { min-height: 32px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--bg); color: var(--text); flex: none; }
.toast button:focus-visible { outline-color: #111214; }
.langswitch { display: inline-flex; border: 1px solid var(--line3); border-radius: 8px; overflow: hidden; flex: none; }
.langswitch button { min-height: 36px; min-width: 40px; padding: 0 10px; border: 0; background: transparent; color: var(--soft); font-family: var(--display); font-weight: 600; letter-spacing: .06em; }
.langswitch button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.empty { padding: 32px; border-radius: 12px; border: 1px dashed var(--line2); text-align: center; color: var(--muted); }
.empty.boot { margin: 40px; }
</style>
</head>
<body>
<div id="app"><div class="empty boot">…</div></div>
<div id="toast" aria-live="polite"></div>
<script>
'use strict';
/*
 * REPO Save Editor – user interface (vanilla JS, no framework).
 *
 * Rendering: every state change calls render(), which rebuilds #app from the view functions.
 *   Views return html`` templates: values inside ${} are escaped automatically; only results of
 *   html``, tx() and svg() are inserted as markup. Do not build markup by string concatenation.
 * Languages: German and English. Every text lives in TEXTS ([German, English]); t() returns plain
 *   text, tp() plural text, tx() markup with fragments in its placeholders. Catalog labels from the
 *   server come as { de, en } and are picked with L(). The server answers in the language sent in
 *   the X-REPO-Lang header; the choice is stored in settings.json (none stored = system language).
 * Focus: render() puts focus, caret and typed-but-uncommitted number text back afterwards. Inputs are
 *   identified by data-fk, buttons by their data-* attributes. Scroll boxes carry data-keep-scroll.
 * Events are delegated on document:

// The session token arrives in the URL fragment. It is taken out of the address at once (so it does not
// stay in a normal browser's history with `npm run serve`) and kept in this tab's sessionStorage, so a
// reload still works.
const TOKEN = (() => {
  const KEY = 'repo-editor-token';
  const fromUrl = new URLSearchParams(location.hash.slice(1)).get('token');
  if (fromUrl) {
    try { sessionStorage.setItem(KEY, fromUrl); } catch { /* storage blocked: a reload needs the editor's link again */ }
    history.replaceState(null, '', location.pathname + location.search);
    return fromUrl;
  }
  try { return sessionStorage.getItem(KEY) || ''; } catch { return ''; }
})();

// ---------- html templates (auto-escaping) ------------------------------------------------------
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const RAW = Symbol('raw');
const raw = s => ({ [RAW]: String(s) });  // trusted markup only (our own templates and icons)
const toHtml = v => (v == null || v === false ? '' : Array.isArray(v) ? v.map(toHtml).join('') : v[RAW] !== undefined ? v[RAW] : esc(v));
const html = (strings, ...values) => raw(strings.reduce((out, s, i) => out + toHtml(values[i - 1]) + s));
/** A boolean attribute such as disabled or checked, present only when `on` */
const attr = (name, on) => (on ? raw(' ' + name) : '');
/** data-* attributes from an object (values escaped) */
const dataAttrs = obj => raw(Object.entries(obj || {}).map(([k, v]) => ' data-' + k + '="' + esc(v) + '"').join(''));

// ---------- language ------------------------------------------------------------------------------
const systemLanguage = () => (String(navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'en');
function setLanguage(lang) {
  S.lang = LANGUAGES.includes(lang) ? lang : 'en';
  document.documentElement.lang = S.lang;
}
const langIndex = () => LANGUAGES.indexOf(S.lang);
const fill = (text, params) => text.replace(/\{(\w+)\}/g, (all, k) => (params[k] !== undefined ? String(params[k]) : all));
/** Plain text for `key` in the current language, {placeholders} filled from params. */
function t(key, params = {}) {
  const entry = TEXTS[key];
  return entry ? fill(entry[langIndex()], params) : key; // a missing key shows up instead of breaking the page
}
/** Plural text: the one/many form for n, with {n} formatted for the language. */
function tp(key, n, params = {}) {
  const forms = TEXTS[key][langIndex()];
  return fill(forms[n === 1 ? 0 : 1], Object.assign({ n: fmt(n) }, params));
}
/** Markup for `key`: the text is escaped, placeholders may be html`` fragments (or plain values). */
function tx(key, params = {}) {
  const parts = TEXTS[key][langIndex()].split(/(\{\w+\})/);
  return raw(parts.map(part => {
    const m = part.match(/^\{(\w+)\}$/);
    return m && params[m[1]] !== undefined ? toHtml(params[m[1]]) : esc(part);
  }).join(''));
}
/** Label from the catalog: { de, en } per language, or a plain string (names from the game). */
const L = v => (v && typeof v === 'object' ? v[S.lang] || v.en : v);

// ---------- formatting -------------------------------------------------------------------------
const fmt = n => Number(n).toLocaleString(LOCALES[S.lang]);
const money = n => '$ ' + fmt(n) + ' K';
const clone = o => JSON.parse(JSON.stringify(o));
/** Number stored under an own key of a count map (save data may hold keys like "constructor"). */
const count = (map, key) => (Object.prototype.hasOwnProperty.call(map, key) ? map[key] : 0);
const clampTo = (n, lo, hi) => Math.max(lo, Math.min(hi, Math.round(n)));
/** number from an input, or null for empty/invalid input (the old value is kept then) */
const parseNum = v => (typeof v === 'string' && !v.trim() ? null : Number.isFinite(Number(v)) ? Number(v) : null);
/** A color (hex or var()) mixed with transparency, for soft backgrounds. */
const tint = (color, percent) => 'color-mix(in srgb, ' + color + ' ' + percent + '%, transparent)';
const playTime = s => { const m = Math.round((s || 0) / 60); return Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; };
/** "2026-01-15" (as the game stores it) in the date format of the language */
function fmtDate(d) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
  return m ? new Date(+m[1], m[2] - 1, +m[3]).toLocaleDateString(LOCALES[S.lang], { day: '2-digit', month: '2-digit', year: 'numeric' }) : (d || '');
}
const fmtTime = ms => new Date(ms).toLocaleString(LOCALES[S.lang], { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
/** Paths as shown on screen: the user folder appears as %USERPROFILE% (aliases come from the server). */
function displayPath(p) {
  if (!p) return p;
  for (const [from, to] of (S.server && S.server.pathAliases) || []) {
    const rest = p.slice(from.length);
    if (p.toLowerCase().startsWith(from.toLowerCase()) && (rest === '' || rest[0] === '\\' || rest[0] === '/')) return to + rest;
  }
  return p;
}
/** A displayed path that wraps after a backslash rather than inside a folder name (escaped first). */
const breakable = p => (p ? raw(esc(p).replace(/\\/g, '\\<wbr>')) : p);

// ---------- server ------------------------------------------------------------------------------
async function api(method, path, body) {
  let res;
  try {
    res = await fetch(path, {
      method,
      headers: Object.assign({ 'X-REPO-Editor': TOKEN, 'X-REPO-Lang': S.lang }, body !== undefined ? { 'Content-Type': 'application/json' } : {}),
      body: body !== undefined ? JSON.stringify(body) : undefined
    });
  } catch (e) {
    throw Object.assign(new Error(t('api.offline')), { status: 0 });
  }
  let data;
  try { data = await res.json(); } catch (e) { throw Object.assign(new Error(t('api.badAnswer', { status: res.status })), { status: res.status }); }
  if (!res.ok) throw Object.assign(new Error(data.error || t('api.error', { status: res.status })), { status: res.status, reason: data.reason });
  return data;
}
const idQuery = id => '?id=' + encodeURIComponent(id);

// ---------- data helpers ------------------------------------------------------------------------
const C = () => S.server.catalog;
const COS = () => S.server.cosmetics.list;
const LIM = () => S.server.limits;
const catOf = id => C().categories.find(c => c.id === id) || C().categories.find(c => c.id === 'other');
const cosColor = key => (COS_CATEGORIES.find(c => c[0] === key) || [key, 'var(--dim)'])[1];
const cosCategoryName = key => t(TEXTS['cosCat.' + key] ? 'cosCat.' + key : 'cosCat.Other');
const rarityName = r => S.server.cosmetics.rarities[r];
function itemInfo(key) {
  return C().items.find(i => i.key === key) || { key, label: key.replace(/^Item /, ''), cat: 'other', max: 1, disabled: false, wip: false };

// Built-in profiles only raise values ("at least"); own profiles set values exactly.
function builtinProfiles() {
  const allUp = Object.fromEntries(C().upgrades.map(u => [u.field, 10]));
  const weapons = Object.fromEntries(C().items.filter(it => !it.disabled && !it.wip && (it.cat === 'gun' || it.cat === 'melee')).map(it => [it.key, 1]));
  const heal = { 'Item Health Pack Small': 3, 'Item Health Pack Medium': 3, 'Item Health Pack Large': 3, 'Item ReviveItem': 1 };
  const profile = (id, key, values) => Object.assign({ id, builtin: true, min: true, name: t('prof.' + key + '.name'), desc: t('prof.' + key + '.desc', { money: money(1000) }) }, values);
  return [
    profile('b-up10', 'up10', { upgrades: allUp }),
    profile('b-money', 'money', { run: { currency: 1000, lives: 5 } }),
    profile('b-arsenal', 'arsenal', { inv: weapons }),
    profile('b-heal', 'heal', { inv: heal })
  ];
}

function profileSummary(p) {
  const parts = [];
  if (p.run) parts.push(tp('n.runValue', Object.keys(p.run).length));
  if (p.upgrades) parts.push(tp('n.upgrade', Object.keys(p.upgrades).length));
  if (p.inv) parts.push(tp('n.item', Object.keys(p.inv).length));
  return parts.join(' · ') || t('prof.empty');
}

function applyProfile(p) {
  const e = S.edit;
  const value = (cur, v) => (p.min ? Math.max(cur || 0, v) : v);
  if (p.run) {
    for (const f of C().run) {
      if (p.run[f.key] === undefined || e.run[f.key] === undefined) continue; // only values the save has
      e.run[f.key] = clampTo(value(e.run[f.key], p.run[f.key]), f.min, f.max);
    }
  }
  if (p.upgrades) {
    const fields = Object.keys(p.upgrades).filter(f => e.upgradeFields.includes(f));
    for (const pl of e.players) {
      for (const f of fields) pl.up[f] = clampTo(value(pl.up[f], p.upgrades[f]), 0, LIM().upgradeLevel);
    }
  }
  if (p.inv) {
    for (const k of Object.keys(p.inv)) {
      const v = clampTo(value(count(e.inv, k), p.inv[k]), 0, LIM().itemCount);
      if (v) e.inv[k] = v; else delete e.inv[k];
    }
  }
}

// ---------- changes ------------------------------------------------------------------------------
/**
 * Differences from model a to model b, in display order. Each entry:
 * { group: 'run'|'players'|'items' (tab badge), pid?, label, from, to, dot (color), undo(e) | null }
 * undo(e) puts a's value back into the model e.
 */
function diffModels(a, b) {
  const out = [];
  const add = (group, label, from, to, dot, undo, pid) => out.push({ group, pid, label, from: String(from), to: String(to), dot, undo });
  const accent = 'var(--accent)';
  const yesNo = v => t(v ? 'common.yes' : 'common.no');

  if (a.team !== b.team) add('run', t('diff.team'), a.team, b.team, accent, e => { e.team = a.team; });
  for (const f of C().run) {
    const av = a.run[f.key], bv = b.run[f.key];
    if (av === undefined || bv === undefined || av === bv) continue;
    const show = v => (f.suffix ? money(v) : fmt(v));
    add('run', L(f.label), show(av), show(bv), accent, e => { e.run[f.key] = av; });
  }
  const ua = a.upgradesPurchased || {}, ub = b.upgradesPurchased || {};
  for (const k of new Set(Object.keys(ua).concat(Object.keys(ub)))) {
    if (count(ua, k) === count(ub, k)) continue;
    const label = t('diff.purchases', { name: itemInfo(k).label.replace(/ Upgrade$/, '') });
    add('run', label, count(ua, k), count(ub, k), UPGRADE_DOT, e => { e.upgradesPurchased[k] = count(ua, k); });
  }

  b.players.forEach((p, i) => {
    const o = a.players.find(x => x.id === p.id);
    const color = playerColor(i);
    const target = e => e.players.find(x => x.id === p.id);
    if (!o) { add('players', p.name, t('diff.missing'), t('diff.present'), color, null, p.id); return; }
    if (o.hp !== p.hp) add('players', p.name + ' · HP', o.hp, p.hp, color, e => { target(e).hp = o.hp; }, p.id);
    if (o.crown !== p.crown) {
      // the crown is exclusive: undo restores the holder for all players
      const undo = e => e.players.forEach(x => { const y = a.players.find(z => z.id === x.id); x.crown = !!(y && y.crown); });
      add('players', t('diff.crown', { name: p.name }), yesNo(o.crown), yesNo(p.crown), color, undo, p.id);
    }
    for (const f of b.upgradeFields) {
      const ov = o.up[f] || 0, pv = p.up[f] || 0;
      if (ov !== pv) add('players', p.name + ' · ' + upgradeInfo(f).name, ov, pv, color, e => { target(e).up[f] = ov; }, p.id);
    }
  });
  for (const o of a.players.filter(x => !b.players.some(p => p.id === x.id))) add('players', o.name, t('diff.present'), t('diff.missing'), 'var(--dim)', null, o.id);

  for (const k of new Set(Object.keys(a.inv).concat(Object.keys(b.inv)))) {
    const av = count(a.inv, k), bv = count(b.inv, k);
    if (av === bv) continue;
    const it = itemInfo(k);
    add('items', it.label, '×' + av, '×' + bv, catOf(it.cat).color, e => { if (av) e.inv[k] = av; else delete e.inv[k]; });
  }
  if (b.fillBatteries && !a.fillBatteries) {
    add('items', t('diff.batteries'), t('diff.notFull', { n: a.batteryLow }), t('diff.allFull'), 'var(--ok)', e => { e.fillBatteries = false; });
  }
  return out;
}
const changes = () => (S.loaded && S.edit ? diffModels(S.loaded.model, S.edit) : []);

function metaChanges() {
  if (!S.meta || !S.metaEdit) return [];
  const before = new Set(S.meta.unlocks), after = S.metaEdit;
  const out = [];
  for (const id of after) if (!before.has(id)) out.push({ id, on: true });
  for (const id of before) if (!after.has(id)) out.push({ id, on: false });
  return out;
}

// ---------- rendering ------------------------------------------------------------------------------
/** Identifies an element across re-renders: data-fk for inputs, all data-* attributes for buttons. */
function focusKey(el) {
  if (!el || !el.dataset) return null;
  if (el.dataset.fk) return 'fk:' + el.dataset.fk;
  if (el.dataset.act) return 'act:' + JSON.stringify(Object.entries(el.dataset).sort());
  return null;
}
function findByKey(root, key) {
  if (!key) return null;
  for (const el of root.querySelectorAll('[data-fk],[data-act]')) if (focusKey(el) === key) return el;
  return null;
}
function safe(fn) { try { return fn(); } catch (e) { return null; } }

let renderedModal = null;
/** @param {{ committed?: boolean }} [opts] committed: the focused number was just applied, show the stored value */
function render(opts = {}) {
  const app = document.getElementById('app');
  const active = document.activeElement;
  const key = focusKey(active);
  const caret = active && 'selectionStart' in active ? [safe(() => active.selectionStart), safe(() => active.selectionEnd)] : null;
  // a number typed but not yet applied (change event) survives re-renders caused by something else
  const typed = !opts.committed && active && active.dataset && active.dataset.num ? active.value : null;
  const scroll = [...document.querySelectorAll('[data-keep-scroll]')].map(el => [el.dataset.keepScroll, el.scrollTop]);

  app.innerHTML = toHtml(S.server ? viewApp() : viewBoot());

  for (const [k, top] of scroll) { const el = app.querySelector('[data-keep-scroll="' + CSS.escape(k) + '"]'); if (el) el.scrollTop = top; }
  if (S.modal && S.modal !== renderedModal) {
    // a dialog just opened: move focus into it
    const dlg = app.querySelector('.dialog');
    const first = dlg && (dlg.querySelector('input, textarea') || dlg.querySelector('[data-primary]') || dlg.querySelector('button'));
    if (first) first.focus();
  } else if (!S.modal && renderedModal) {
    const back = findByKey(app, S.modalReturn); // dialog closed: back to the button that opened it
    if (back) back.focus();
  } else {
    const el = findByKey(app, key);
    if (el) {
      el.focus({ preventScroll: true });
      if (typed !== null) el.value = typed;
      if (caret && caret[0] !== null && el.setSelectionRange) safe(() => el.setSelectionRange(caret[0], caret[1]));
    }
  }
  renderedModal = S.modal;
  renderToast();
}

function openModal(modal) {
  S.modalReturn = focusKey(document.activeElement);
  S.modal = modal;
}
/** Generic confirmation; onOk runs after the user agrees. */
function confirmModal(title, lead, okLabel, onOk) {
  openModal({ type: 'confirm', title, lead, okLabel, onOk });
}
